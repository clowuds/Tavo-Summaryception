<!-- Layered recursive summarization memory for Tavo. v5.7.0
Ported from SillyTavern-Extension-Summaryception by Lodactio.

Core algorithm:
- Verbatim window: N most recent assistant turns kept unhidden
- When overflow: summarize oldest batch via LLM → snippet in Layer 0
- When Layer 0 fills (30 snippets): promote oldest 3 → merge via LLM → Layer 1
- Cascades indefinitely: Layer 1 → Layer 2 → ... up to maxLayers
- Each snippet is context-aware (LLM sees prior context, outputs only delta)
- Summarized messages are ghosted (hidden: true) via tavo.message.update

- Assembled snippets written to Tavo's native long-term memory (tavo.memory) as a string array

[PATCHED] Reliability shim (sc_summary):
- Every internal state save (saveState) also mirrors the current summary
  into a plain chat variable, 'sc_summary' (tavo.set/get, scope 'chat').
  This happens automatically on every update regardless of whether native
  LTM is enabled, since it doesn't depend on tavo.memory at all.
- tavo.memory (native LTM) is only ever written from updateInjection(),
  and it now always reflects the current contents of sc_summary — i.e.
  native LTM receives the "final" computed output, while sc_summary is
  the reliable, always-up-to-date running record.
-->

  /* ===== Inline confirm bar ===== */
  #sc-overlay .sc-confirm-inline {

    from {

      transform: translateY(-4px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  #sc-overlay .sc-confirm-inline-head {
    display: flex;
    align-items: flex-start;
    gap: 7px;
  }
  #sc-overlay .sc-confirm-inline-head .sc-gicon {

  }
  #sc-overlay .sc-num-btn:active {
    background: rgba(var(--sc-accent01), 0.3);
  }

  /* Toggle switch */
  #sc-overlay .sc-toggle {
    position: relative;
    width: 36px;
    height: 20px;
    flex: 0 0 auto;
  }
  #sc-overlay .sc-toggle input {
    opacity: 0;
    width: 0;
    height: 0;
    position: absolute;
  }
  #sc-overlay .sc-toggle-track {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    background: rgba(var(--sc-white), 0.1);
    cursor: pointer;
    transition: background 0.2s;
    border: 1px solid rgba(var(--sc-white), 0.1);
  }
  #sc-overlay .sc-toggle input:checked + .sc-toggle-track {
    background: rgba(var(--sc-accent01), 1);
    border-color: rgba(var(--sc-accent01), 1);
  }
  #sc-overlay .sc-toggle-track::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: rgba(var(--sc-white), 0.5);
    transition: left 0.2s, background 0.2s;
  }
  #sc-overlay .sc-toggle input:checked + .sc-toggle-track::after {
    left: 18px;
    background: #fff;
  }

  #sc-overlay .sc-pill-group {

    transition: all 0.15s;

  #sc-overlay .sc-pill:hover {

  #sc-overlay .sc-sticky-footer-scroll::-webkit-scrollbar-track,

    function isRetryableError(err) {
      if (!err) return false;
      var msg = (err.message || String(err)).toLowerCase();
      if (msg.includes('rate limit') || msg.includes('too many requests')) return true;
      if (msg.includes('server error') || msg.includes('timeout')) return true;
      if (msg.includes('network') || msg.includes('overloaded') || msg.includes('capacity')) return true;
      if (msg.includes('econnreset') || msg.includes('econnrefused')) return true;
      // Empty/blank model responses are skipped immediately, not retried
      return false;
    }

    function getVisibleAssistantTurns(msgs, ghostedIds) {
      var ghostedSet = {};
      for (var i = 0; i < ghostedIds.length; i++) ghostedSet[ghostedIds[i]] = true;
      var turns = [];
      for (var i = 0; i < msgs.length; i++) {
        var m = msgs[i];
        if (m.role === 'assistant' && m.content && m.content.trim().length > 0 && !ghostedSet[m.id]) {
          turns.push(m);

    function buildPassageFromRange(msgs, startId, endId, ghostedIds) {
      // Build a set of ghosted (already-summarized) IDs so we can skip them.
      // This prevents Force Summarize from re-sending the entire chat history
      // when summarizedUpTo is reset after a Stop — only the truly visible
      // (un-ghosted) messages in the range are passed to the summarizer.
      var ghostedSet = {};
      if (Array.isArray(ghostedIds)) {
        for (var g = 0; g < ghostedIds.length; g++) ghostedSet[ghostedIds[g]] = true;
      }
      var lines = [];
      var inRange = false;
      for (var i = 0; i < msgs.length; i++) {
        var m = msgs[i];
        if (m.id === startId) inRange = true;
        if (inRange && !ghostedSet[m.id] && m.content && m.content.trim()) {
          var speaker = m.role === 'user' ? 'Player': 'Assistant';
          lines.push(speaker + ': ' + m.content.trim());
        }
        if (m.id === endId) break;
      }
      return lines.join('\n');
    }
    function findPassageStart(msgs, summarizedUpTo) {
      if (summarizedUpTo < 0) return msgs.length > 0 ? msgs[0]: null;
      for (var i = 0; i < msgs.length; i++) {
        if (msgs[i].id === summarizedUpTo) {
          return i + 1 < msgs.length ? msgs[i + 1]: null;
        }
      }
      return null;
    }

    async function updateInjection() {
      var state = getState();
      updateFabBadge(state);

      // [Retrieval pass over the permanent Layer 0 archive — cheap, no LLM call.
      // Picks up to the configured "Max recalled snippets" cap of old snippets whose tags overlap with
      // what's currently happening, so events from thousands of messages ago
      // can resurface exactly when relevant instead of sitting permanently in
      // context. Cached in _lastTriggered so assembleSummaryBlock (used both
      // here and by the sync Injection Preview) and the panel's "Triggered
      // Memories" section can all read the same computed list.]
      _lastTriggered = await computeTriggeredMemories(state);
      try {
        tavo.set(TRIGGERED_VAR_KEY, {
          items: _lastTriggered, updatedAt: Date.now()
        }, 'chat');
      } catch (e) {
        console.error('[sc] updateInjection: failed writing sc_triggered var:', e);
      }

      // [sc_summary is the reliable source of truth (see saveState/writeSummaryVar).
      // Refresh it here too so updateInjection() is self-sufficient even if called
      // outside a saveState() path, then read back from it — this is the "final
      // output" that native LTM receives. Native tavo.memory is never written to
      // from anywhere else; it only ever mirrors whatever is currently in the var.]
      writeSummaryVar(state);
      var snippets = buildSnippetsArray(state);
      var triggeredTexts = _lastTriggered.map(function (t) {
        return t.text;
      });
      var injectedSnippets = snippets.concat(triggeredTexts);
      try {
        // [Always read the live enabled/disabled flag straight from Tavo right
        // before writing, instead of trusting a cached settings snapshot. This
        // lets a toggle flipped directly in Tavo's sidebar (or another tab)
        // survive the next poll tick.
        //
        // wantEnabled logic:
        //   - nativeMemoryManual=true  → user (or SC toggle) has explicitly set
        //     the state at least once; always mirror mem.enabled as-is so both
        //     SC's own toggle and Tavo's sidebar are respected.
        //   - nativeMemoryManual=false → SC has never touched the flag. Only
        //     auto-enable when snippets first appear AND mem.enabled is currently
        //     false (i.e. don't auto-disable if the user turned it on themselves
        //     via Tavo's sidebar). Once we auto-enable, mark nativeMemoryManual
        //     so future polls just mirror Tavo's live state like the first branch.]
        var mem = await tavo.memory.current();
        var settings = await getEffectiveSettings();
        var wantEnabled;
        if (isPerChatSettingsEnabled()) {
          // Per-chat mode: check if this chat has an explicit ltmEnabled preference
          // saved in sc_chat_config. If so, enforce it (and sync tavo.memory to
          // match). If not yet set, leave mem.enabled untouched so the Tavo
          // sidebar state is respected.
          var chatCfgNow = getChatConfig();
          if (chatCfgNow && chatCfgNow.ltmEnabled != null) {
            wantEnabled = !!chatCfgNow.ltmEnabled;
          } else {
            wantEnabled = mem.enabled;
          }
        } else if (settings.nativeMemoryManual) {
          // Global mode, user has explicitly set LTM at least once: enforce the
          // saved ltmEnabled preference so Tavo's sidebar or session restore can't
          // silently flip it back. Fall back to mem.enabled only if no preference
          // has been stored yet (legacy installs where ltmEnabled was never written).
          wantEnabled = settings.ltmEnabled != null ? !!settings.ltmEnabled : mem.enabled;
        } else {
          // Global mode, auto: never force-disable; only auto-enable on first snippet.
          if (injectedSnippets.length > 0 && !mem.enabled) {
            wantEnabled = true;
            setConfig({ nativeMemoryManual: true });
            _configCache = getConfig();
          } else {
            wantEnabled = mem.enabled;
          }
        }

        // [v5.7.0: LTM is injection-only — SC never reads back from tavo.memory.
        // All snippet management goes through SC's own state (sc_state chat var)
        // and the panel's + button. External edits to tavo.memory are ignored.]

        // [Build a cheap fingerprint: enabled flag + joined snippet texts + the
        // triggered-memory picks. Skip the memory write entirely when nothing
        // has changed, avoiding unnecessary API traffic on every 8-second poll tick.]
        var injectedKey = (wantEnabled ? '1': '0') + '|' + injectedSnippets.join('\x00');
        if (injectedKey === _lastInjectedKey) {
          _ltmMemoryCache = mem;
          return;
        }
        _lastInjectedKey = injectedKey;
        mem.enabled = wantEnabled;
        mem.memories = injectedSnippets;
        await tavo.memory.update(mem);
        _ltmMemoryCache = mem;
      } catch (e) {
        console.error('[sc] updateInjection (memory) failed:', e);
      }
    }
    function updateFabBadge(state) {
      var total = 0;
      if (state.layers) {
        for (var i = 0; i < state.layers.length; i++) {
          if (state.layers[i]) total += state.layers[i].length;
        }
      }
      fabBadge.setAttribute('data-count', String(total));
      fabBadge.textContent = total > 999 ? '999+': String(total);
      fabBadge.classList.toggle('is-visible', total > 0);
    }
    
    // ––––– Ghosting
    async function ghostMessage(msg) {
      try {
        await tavo.message.update({
          id: msg.id, content: msg.content, hidden: true
        });
        var state = getState();
        if (state.ghostedIds.indexOf(msg.id) === -1) {
          state.ghostedIds.push(msg.id);
          saveState(state);
        }
      } catch (e) {
        console.error('[sc] ghostMessage failed for id=' + msg.id + ':', e);
      }
    }
    async function unghostMessage(msg) {
      try {
        await tavo.message.update({
          id: msg.id, content: msg.content, hidden: false
        });
        var state = getState();
        var idx = state.ghostedIds.indexOf(msg.id);
        if (idx >= 0) {
          state.ghostedIds.splice(idx, 1);
          saveState(state);
        }
      } catch (e) {
        console.error('[sc] unghostMessage failed for id=' + msg.id + ':', e);
      }
    }
    async function ghostMessagesUpTo(endId, msgs) {
      var settings = await getEffectiveSettings();
      var ghostedSet = {};
      var state = getState();
      for (var i = 0; i < state.ghostedIds.length; i++) ghostedSet[state.ghostedIds[i]] = true;

      for (var i = 0; i < msgs.length; i++) {
        var m = msgs[i];
        if (m.id === endId) break;
        if (m.role !== 'assistant') continue;
        if (!m.content || !m.content.trim()) continue;
        if (settings.disableGhosting) {
          // Track but don't actually hide — both assistant and ALL preceding
          // consecutive user turns (not just the one immediately before it —
          // multiple user messages in a row before a reply must all be caught).
          // state.ghostedIds is mutated directly here (no intervening save), so it's
          // safe to persist this whole object once, below.
          if (!ghostedSet[m.id]) {
            state.ghostedIds.push(m.id); ghostedSet[m.id] = true;
          }
          for (var p = i - 1; p >= 0 && msgs[p].role === 'user'; p--) {
            var prevM = msgs[p];
            if (!ghostedSet[prevM.id]) {
              state.ghostedIds.push(prevM.id);
              ghostedSet[prevM.id] = true;
            }
          }
        } else {
          // [ghostMessage() persists each id itself (fresh read → push → save) as it
          // goes, including ALL preceding consecutive user turns. Don't touch/save
          // `state` here — doing so would overwrite that with this function's stale
          // pre-loop snapshot and silently drop whatever was just persisted.]
          if (!ghostedSet[m.id]) {
            await ghostMessage(m); ghostedSet[m.id] = true;
          }
          for (var p = i - 1; p >= 0 && msgs[p].role === 'user'; p--) {
            var prevM = msgs[p];
            if (!ghostedSet[prevM.id]) {
              await ghostMessage(prevM);
              ghostedSet[prevM.id] = true;
            }
          }
        }
      }

      // Only needed for the disableGhosting branch above, which mutates `state`
      // in place without saving per-iteration.
      if (settings.disableGhosting) {
        saveState(state);
      }
    }
    async function unghostAllMessages(msgs) {
      var state = getState();
      var toUnghost = state.ghostedIds.slice();

      // [Recover any messages that are actually hidden but fell out of ghostedIds
      // tracking (e.g. from the earlier state-clobbering bug), so this is a true
      // "restore everything" instead of trusting only the tracked list.]
      var trackedSet = {};
      for (var t = 0; t < toUnghost.length; t++) trackedSet[toUnghost[t]] = true;
      var scanMsgs = msgs;
      if (!scanMsgs) {
        try {
          scanMsgs = await tavo.message.find([]);
        } catch (e) {
          scanMsgs = [];
        }
      }
      if (Array.isArray(scanMsgs)) {
        for (var s = 0; s < scanMsgs.length; s++) {
          var sm = scanMsgs[s];
          if (sm && sm.hidden === true && !trackedSet[sm.id]) {
            toUnghost.push(sm.id);
            trackedSet[sm.id] = true;
          }
        }
      }

      if (toUnghost.length === 0) return 0;

      // Build a quick map from any already-fetched msgs for efficiency,
      // then fall back to tavo.message.get for any id not in the map.
      var msgMap = {};
      if (msgs) {
        for (var i = 0; i < msgs.length; i++) msgMap[msgs[i].id] = msgs[i];
      }

      for (var j = 0; j < toUnghost.length; j++) {
        var id = toUnghost[j];
        var msg = msgMap[id];
        if (!msg) {
          try {
            msg = await tavo.message.get(id);
          } catch (e) {
            msg = null;
          }
        }
        if (msg) {
          try {
            await tavo.message.update({
              id: msg.id, content: msg.content, hidden: false
            });
          } catch (e) {
            console.error('[sc] unghost failed for id=' + id + ':', e);
          }
        }
      }
      state.ghostedIds = [];
      saveState(state);
      return toUnghost.length;
    }
    
    // ––––– Verbatim floor enforcement
    // Self-healing safety net: regardless of how ghosting got triggered guarantee the last N assistant turns (and their paired user turns) are never left hidden.
    async function enforceVerbatimFloor(msgs, settings) {
      var allTurns = getAssistantTurns(msgs); // all assistant turns, hidden or not
      var floorIdx = allTurns.length <= settings.verbatimTurns
      ? 0: allTurns.length - settings.verbatimTurns;
      var floorTurns = allTurns.slice(floorIdx);
      if (floorTurns.length === 0) return 0;

      var floorIdSet = {};
      for (var i = 0; i < floorTurns.length; i++) floorIdSet[floorTurns[i].id] = true;

      var unhidCount = 0;
      for (var i = 0; i < msgs.length; i++) {
        var m = msgs[i];
        if (!m.hidden) continue;
        var isFloorAssistant = m.role === 'assistant' && floorIdSet[m.id];
        var isFloorPairedUser = false;
        if (m.role === 'user') {
          // Walk forward past any consecutive user turns to find the next
          // non-user message — not just msgs[i+1] — so a run of several
          // user turns in a row before one assistant reply all pair correctly.
          var j = i + 1;
          while (j < msgs.length && msgs[j].role === 'user') j++;
          var next = j < msgs.length ? msgs[j]: null;
          if (next && next.role === 'assistant' && floorIdSet[next.id]) isFloorPairedUser = true;
        }
        if (isFloorAssistant || isFloorPairedUser) {
          await unghostMessage(m);
          unhidCount++;
        }
      }
      return unhidCount;
    }
    
    // ––––– Branch repair
    async function repairIfBranched(msgs) {
      var state = getState();
      if (state.summarizedUpTo < 0) return false;
      var currentIds = {};
      for (var i = 0; i < msgs.length; i++) currentIds[msgs[i].id] = true;
      // [Check if summarizedUpTo ID still exists. The msgs snapshot passed in
      // may simply be stale (e.g. a poll fired mid-edit), so before concluding
      // the chat actually branched/swiped away from it, try a direct lookup by
      // id — this avoids falsely trimming Layer 0 snippets that are still
      // perfectly valid.]
      if (!currentIds[state.summarizedUpTo]) {
        try {
          var directHit = await tavo.message.get(state.summarizedUpTo);
          if (directHit) currentIds[state.summarizedUpTo] = true;
        } catch (e) {
          // fall through — treat as branched
        }
      }
      if (!currentIds[state.summarizedUpTo]) {
        // Branch detected — trim Layer 0 snippets whose turnRange references non-existent IDs
        if (state.layers[0]) {
          var before = state.layers[0].length;
          state.layers[0] = state.layers[0].filter(function (sn) {
            if (!sn.turnRange) return true;
            return currentIds[sn.turnRange[1]];
          });
          var removed = before - state.layers[0].length;
          if (removed > 0) {
            console.log('[sc] Branch repair: removed ' + removed + ' stale Layer 0 snippets');
          }
        }
        // Recalculate summarizedUpTo
        if (state.layers[0] && state.layers[0].length > 0) {
          var maxEnd = -1;
          for (var i = 0; i < state.layers[0].length; i++) {
            var sn = state.layers[0][i];
            if (sn.turnRange && sn.turnRange[1] > maxEnd) maxEnd = sn.turnRange[1];
          }
          state.summarizedUpTo = maxEnd;
        } else {
          state.summarizedUpTo = -1;
        }
        // Trim ghostedIds
        state.ghostedIds = state.ghostedIds.filter(function (id) {
          return currentIds[id];
        });
        saveState(state);
        tavo.utils.toast(t('toast.branchRepaired'));
        return true;
      }
      return false;
    }
    
    // ––––– Gap repair: recover lost snippets
    // This scans for exactly that (hidden + not covered by any Layer 0 turnRange) and re-summarizes each gap, using message IDs.
    async function recoverLostSnippets(msgs, settings) {
      var state = getState();
      if (!state.layers[0]) state.layers[0] = [];

      // [Lookup by id, falling back to a direct fetch for any id that isn't in
      // this particular msgs snapshot (e.g. a stale/partial fetch) rather than
      // assuming the message is gone.]
      var msgMap = {};
      for (var i = 0; i < msgs.length; i++) msgMap[msgs[i].id] = msgs[i];
      async function resolveMsg(id) {
        if (msgMap[id]) return msgMap[id];
        try {
          var m = await tavo.message.get(id);
          if (m) msgMap[id] = m;
          return m;
        } catch (e) {
          return null;
        }
      }

      // Mark every message id already accounted for by a Layer 0 snippet.
      var covered = {};
      for (var i = 0; i < state.layers[0].length; i++) {
        var sn = state.layers[0][i];
        if (!sn.turnRange) continue;
        var inRange = false;
        for (var j = 0; j < msgs.length; j++) {
          if (msgs[j].id === sn.turnRange[0]) inRange = true;
          if (inRange) covered[msgs[j].id] = true;
          if (msgs[j].id === sn.turnRange[1]) break;
        }
      }

      // Walk the chat in order, collecting contiguous runs of hidden-but-
      // uncovered messages — these are the gaps left behind by a deleted
      // snippet (or any other event that hid messages without recording why).
      var gaps = [];
      var current = null;
      for (var i = 0; i < msgs.length; i++) {
        var m = msgs[i];
        var isOrphan = m.hidden === true && !covered[m.id];
        if (isOrphan) {
          if (!current) current = {
            startId: m.id,
            endId: m.id
          };
          else current.endId = m.id;
        } else if (current) {
          gaps.push(current); current = null;
        }
      }
      if (current) gaps.push(current);
      if (gaps.length === 0) return 0;

      var recovered = 0;
      for (var g = 0; g < gaps.length; g++) {
        var gap = gaps[g];
        await resolveMsg(gap.startId);
        await resolveMsg(gap.endId);

        var storyTxt = buildPassageFromRange(msgs, gap.startId, gap.endId);
        if (!storyTxt.trim()) continue;

        var contextStr = buildFullContext(state, 0);
        tavo.utils.toast(t('toast.recoveringSnippet', {i: g + 1, total: gaps.length}));
        var result = await callSummarizer(storyTxt, contextStr, settings, true);
        if (!result || !result.text) continue;

        var recoveredEntry = {
          sid: nextSnippetId(state),
          text: result.text,
          tags: result.tags,
          turnRange: [gap.startId,
            gap.endId],
          timestamp: Date.now(),
          recovered: true
        };
        state.layers[0].push(recoveredEntry);
        appendArchiveEntry( {
          sid: recoveredEntry.sid,
          text: recoveredEntry.text,
          tags: recoveredEntry.tags,
          turnRange: recoveredEntry.turnRange,
          timestamp: recoveredEntry.timestamp
        });
        recovered++;
      }

      if (recovered > 0) {
        // Keep Layer 0 chronological so context-building and future gap scans
        // stay correct.
        state.layers[0].sort(function (a, b) {
          var aId = a.turnRange ? a.turnRange[0]: 0;
          var bId = b.turnRange ? b.turnRange[0]: 0;
          return aId - bId;
        });
        var maxEnd = state.summarizedUpTo;
        for (var i = 0; i < state.layers[0].length; i++) {
          var sn = state.layers[0][i];
          if (sn.turnRange && sn.turnRange[1] > maxEnd) maxEnd = sn.turnRange[1];
        }
        state.summarizedUpTo = maxEnd;
        saveState(state);
        await updateInjection();
      }

      return recovered;
    }
    
    // ––––– Core: maybeSummarizeTurns
    async function maybeSummarizeTurns() {
      var settings = await getEffectiveSettings();
      if (!settings.enabled) return;
      if (settings.pauseSummarization) return;
      if (_isSummarizing) return;

      var msgs = await getAllMessages();
      if (msgs.length === 0) return;

      await repairIfBranched(msgs);

      var state = getState();
      var visibleTurns = getVisibleAssistantTurns(msgs, state.ghostedIds);
      var allTurns = getAssistantTurns(msgs);

      if (allTurns.length <= settings.verbatimTurns) return;

      // Use only VISIBLE turns for the overflow count
      var unsummarizedVisible = visibleTurns.filter(function(t) { return t.id > state.summarizedUpTo; });
      var overflow = Math.max(0, unsummarizedVisible.length - settings.verbatimTurns);
      var backlogThreshold = settings.turnsPerSummary * 2;

      if (overflow < settings.turnsPerSummary) return;

      if (overflow > backlogThreshold && !_catchupDismissed) {
        var batchesNeeded = Math.ceil(overflow / settings.turnsPerSummary);
        var choice = await tavo.utils.select([{
          value: 'catchup', label: t('backlog.process.label'), description: t('backlog.process.desc', {overflow: overflow}), subtitle: t('backlog.process.sub', {count: batchesNeeded})
        },
          {
            value: 'skip', label: t('backlog.skip.label'), description: t('backlog.skip.desc')
          },
          {
            value: 'partial', label: t('backlog.partial.label'), description: t('backlog.partial.desc', {count: settings.turnsPerSummary})
          }], t('backlog.title', {overflow: overflow}), 'catchup');

        if (choice === 'skip') {
          var cutoff = allTurns[allTurns.length - settings.verbatimTurns - 1];
          if (cutoff) {
            state.summarizedUpTo = cutoff.id;
            saveState(state);
            await ghostMessagesUpTo(cutoff.id, msgs);
          }
          _catchupDismissed = true;
          return;
        } else if (choice === 'catchup') {
          await runCatchup(msgs);
          return;
        } else if (choice === 'partial') {
          await summarizeOneBatch(msgs);
          return;
        }
        return;
      }

      var success = await summarizeOneBatch(msgs);
      if (success) {
        // Check if still over limit
        var freshMsgs = await getAllMessages();
        var freshState = getState();
        var remaining = getVisibleAssistantTurns(freshMsgs, freshState.ghostedIds);
        if (remaining.length > settings.verbatimTurns && remaining.length - settings.verbatimTurns <= backlogThreshold) {
          await maybeSummarizeTurns();
        }
      }
    }
    
    // ––––– Core: summarizeOneBatch
    async function summarizeOneBatch(msgs) {
      var settings = await getEffectiveSettings();
      var state = getState();

      var visibleTurns = getVisibleAssistantTurns(msgs, state.ghostedIds);
      // [When noSummarizeVerbatim is on, only turns older than the verbatim
      // window are ever eligible — the most recent N turns are permanently
      // protected and will never be fed to the summarizer.]
      var allTurns = getAssistantTurns(msgs);
      // verbatimProtectedStart was previously used as an index into visibleTurns,
      // but it's derived from allTurns — a different, longer array. Comparing that
      // index against visibleTurns positions fires the break too early. Use the
      // boundary turn's ID instead so the comparison is array-agnostic.
      var verbatimBoundaryId = null;
      if (settings.noSummarizeVerbatim) {
        var protectedStartIdx = Math.max(0, allTurns.length - settings.verbatimTurns);
        if (protectedStartIdx < allTurns.length) {
          verbatimBoundaryId = allTurns[protectedStartIdx].id;
        }
      }
      var eligible = [];
      for (var i = 0; i < visibleTurns.length; i++) {
        if (verbatimBoundaryId !== null && visibleTurns[i].id >= verbatimBoundaryId) break;
        if (visibleTurns[i].id > state.summarizedUpTo) eligible.push(visibleTurns[i]);
      }

      if (eligible.length === 0) {
        var toGhost = [];
        for (var i = 0; i < visibleTurns.length; i++) {
          if (visibleTurns[i].id <= state.summarizedUpTo) toGhost.push(visibleTurns[i]);
        }
        for (var j = 0; j < toGhost.length; j++) {
          await ghostMessage(toGhost[j]);
        }
        return null; // nothing to do here — not a failure, don't count it as one
      }

      var batchSize = Math.min(settings.turnsPerSummary, eligible.length);
      var batch = eligible.slice(0, batchSize);
      if (batch.length === 0) return false;

      _isSummarizing = true;
      _abortRequested = false;

      var stopBtn = document.getElementById('sc-btn-stop');
      if (stopBtn) {
        stopBtn.disabled = false; stopBtn.classList.add('sc-btn-danger');
      }

      if (_panelOpen) renderAll();

      try {
        var startMsg = findPassageStart(msgs, state.summarizedUpTo);
        if (!startMsg) return false;
        var startId = startMsg.id;
        var endId = batch[batch.length - 1].id;

        if (startId > endId) return false;

        var storyTxt = buildPassageFromRange(msgs, startId, endId, state.ghostedIds);
        if (!storyTxt.trim()) return false;

        var contextStr = buildFullContext(state, 0);
        tavo.utils.toast(t('toast.summarizingN', {count: batch.length}));

        var result = await callSummarizer(storyTxt, contextStr, settings, true);
        if (!result || !result.text) {
          return false;
        }

        // Re-fetch state now that the (slow, awaited) summarizer call has
        // returned — anything else that saved state while we were waiting
        // (a promotion, poll(), another batch) must not be clobbered by
        // writing back the stale pre-await snapshot.
        state = getState();

        var newL0Entry = {
          sid: nextSnippetId(state),
          text: result.text,
          tags: result.tags,
          turnRange: [startId,
            endId],
          timestamp: Date.now()
        };
        ensureLayer(state, 0).push(newL0Entry);
        appendArchiveEntry( {
          sid: newL0Entry.sid,
          text: newL0Entry.text,
          tags: newL0Entry.tags,
          turnRange: newL0Entry.turnRange,
          timestamp: newL0Entry.timestamp
        });
        state.summarizedUpTo = Math.max(state.summarizedUpTo, endId);
        saveState(state);

        // Ghosting is intentionally capped to the verbatim window, independent of
        // how far summarization (endId) reached. Recent turns get summarized into
        // a snippet like any other batch, but stay visible/unhidden until they age
        // out of the verbatim window on a later pass.
        var ghostEnd = endId;
        var allTurns = getAssistantTurns(msgs);
        var verbatimStartIdx = allTurns.length - settings.verbatimTurns;
        if (verbatimStartIdx <= 0) {
          ghostEnd = null; // entire history is within the verbatim window
        } else {
          var verbatimBoundaryId = allTurns[verbatimStartIdx].id;
          if (verbatimBoundaryId < ghostEnd) ghostEnd = verbatimBoundaryId;
        }
        if (ghostEnd !== null) {
          await ghostMessagesUpTo(ghostEnd, msgs);
        }
        await maybePromoteLayer(0);

        state = getState();
        saveState(state);
        await updateInjection();

        tavo.utils.toast(t('toast.summarySaved', {count: (state.layers[0] ? state.layers[0].length: 0)}));

        // ––– Auto Repair
        if (settings.autoRepair) {
          loadAutoRepairCount(); // restore persisted count if not yet loaded this session
          saveAutoRepairCount(_autoRepairSnippetsSince + 1);
          var repairInterval = Math.max(1, settings.autoRepairInterval || DEFAULT_SETTINGS.autoRepairInterval);
          if (_autoRepairSnippetsSince >= repairInterval) {
            saveAutoRepairCount(0);
            tavo.utils.toast(t('toast.autoRepairScanning'));
            try {
              var arMsgs = await getAllMessages();
              var arCurrentIds = {};
              for (var ari = 0; ari < arMsgs.length; ari++) arCurrentIds[arMsgs[ari].id] = true;
              var arState = getState();
              var arRepaired = 0;
              // Remove stale ghostedIds
              var arValidGhosted = arState.ghostedIds.filter(function (id) { return arCurrentIds[id]; });
              arRepaired += arState.ghostedIds.length - arValidGhosted.length;
              if (arRepaired > 0) arState.ghostedIds = arValidGhosted;
              // Prune Layer 0 orphans
              if (arState.layers && arState.layers[0]) {
                var arBefore = arState.layers[0].length;
                arState.layers[0] = arState.layers[0].filter(function (sn) {
                  if (!sn.turnRange) return true;
                  return arCurrentIds[sn.turnRange[0]] && arCurrentIds[sn.turnRange[1]];
                });
                arRepaired += arBefore - arState.layers[0].length;
              }
              if (arRepaired > 0) {
                saveState(arState);
                _lastInjectedKey = null;
                await updateInjection();
                tavo.utils.toast(t('toast.autoRepairFixed', {count: arRepaired}));
              } else {
                tavo.utils.toast(t('toast.autoRepairNoIssues'));
              }
            } catch (arErr) {
              console.warn('[sc] Auto Repair failed:', arErr);
            }
          }
        }

        return true;
      } catch (e) {
        console.error('[sc] summarizeOneBatch error:', e);
        return false;
      } finally {
        _isSummarizing = false;
        if (_panelOpen) renderAll();
      }
    }
    
    // ––––– Core: runForceAll
    // Like runCatchup but summarizes ALL non-hidden turns, ignoring verbatimTurns.
    async function runForceAll(initialMsgs, settings) {
      var totalBatches = 0;
      var completed = 0;
      var failed = 0;
      var consecutiveFailures = 0;

      _isSummarizing = true;
      _abortRequested = false;

      try {
        while (true) {
          if (_abortRequested) {
            tavo.utils.toast(t('toast.forceStopped')); break;
          }

          var msgs = await getAllMessages();
          var freshState = getState();
          var visibleTurns = getVisibleAssistantTurns(msgs, freshState.ghostedIds);

          var eligible = [];
          for (var i = 0; i < visibleTurns.length; i++) {
            if (visibleTurns[i].id > freshState.summarizedUpTo) eligible.push(visibleTurns[i]);
          }

          // Guard: never touch the N most recent assistant turns (the verbatim window),
          // even during Force Summarize.
          var maxEligible = visibleTurns.length - settings.verbatimTurns;
          if (maxEligible <= 0) break;
          if (eligible.length > maxEligible) eligible = eligible.slice(0, maxEligible);

          if (eligible.length === 0) break;

          var batchSize = Math.min(settings.turnsPerSummary, eligible.length);
          var batch = eligible.slice(0, batchSize);
          var startMsg = findPassageStart(msgs, freshState.summarizedUpTo);
          if (!startMsg) break;

          var startId = startMsg.id;
          var endId = batch[batch.length - 1].id;
          if (startId > endId) break;

          var storyTxt = buildPassageFromRange(msgs, startId, endId, freshState.ghostedIds);
          if (!storyTxt.trim()) {
            freshState.summarizedUpTo = endId; saveState(freshState); continue;
          }

          var contextStr = buildFullContext(freshState, 0);
          tavo.utils.toast(t('toast.forceBatch', {n: completed + 1, count: batch.length}));

          var result = await callSummarizer(storyTxt, contextStr, settings, true);
          if (result && result.text) {
            window._scEmptyCount = 0; // Reset counter
            window._scLastErrorMsg = null;
            var s = getState();
            if (!s.layers[0]) s.layers[0] = [];
            var forceL0Entry = {
              sid: nextSnippetId(s),
              text: result.text,
              tags: result.tags,
              turnRange: [startId,
                endId],
              timestamp: Date.now()
            };
            s.layers[0].push(forceL0Entry);
            appendArchiveEntry( {
              sid: forceL0Entry.sid,
              text: forceL0Entry.text, tags: forceL0Entry.tags,
              turnRange: forceL0Entry.turnRange, timestamp: forceL0Entry.timestamp
            });
            s.summarizedUpTo = Math.max(s.summarizedUpTo, endId);
            saveState(s);
            await ghostMessagesUpTo(endId, msgs);
            await maybePromoteLayer(0);
            completed++;
            consecutiveFailures = 0;
            if (completed % 3 === 0 && _panelOpen) renderAll();
          } else {
            failed++;
            consecutiveFailures++;

            if (window._scFailReason === 'empty') {
              window._scEmptyCount = (window._scEmptyCount || 0) + 1;
            } else {
              window._scEmptyCount = 0;
            }

            // [FIX] Do NOT advance summarizedUpTo here. Doing so marked this
            // batch's turns as "already summarized" even though no snippet was
            // ever created for them, permanently skipping their content on
            // every future pass. Leave summarizedUpTo untouched so the same
            // turns remain eligible and get retried on the next batch/loop.

            if (window._scEmptyCount >= 3) {
              tavo.utils.toast(t('toast.threeEmptyStop')); break;
            }
            if (consecutiveFailures >= 10) {
              tavo.utils.toast(t('toast.tenErrorsStop', {err: (window._scLastErrorMsg || 'unknown')}));
              break;
            }
          }

          await sleep(3000);
        }

        if (failed === 0) {
          tavo.utils.toast(t('toast.forceDone', {count: completed}));
        } else {
          tavo.utils.toast(t('toast.forceDoneMixed', {ok: completed, failed: failed}));
        }
      } finally {
        _isSummarizing = false;
        await updateInjection();
        if (_panelOpen) renderAll();
      }
    }
    
    // ––––– Core: runCatchup
    async function runCatchup(initialMsgs) {
      var settings = await getEffectiveSettings();
      var state = getState();
      var allTurns = getAssistantTurns(initialMsgs);
      var unsummarizedTurns = allTurns.filter(function(t) { return t.id > state.summarizedUpTo; });
      var overflow = Math.max(0, unsummarizedTurns.length - settings.verbatimTurns);
      var totalBatches = Math.ceil(overflow / settings.turnsPerSummary);
      var completed = 0;
      var failed = 0;
      var cancelled = false;
      var consecutiveFailures = 0;

      _isSummarizing = true;
      _abortRequested = false;

      var stopBtn = document.getElementById('sc-btn-stop');
      if (stopBtn) {
        stopBtn.disabled = false; stopBtn.classList.add('sc-btn-danger');
      }

      try {
        while (!cancelled) {
          if (_abortRequested) {
            cancelled = true; break;
          }

          var msgs = await getAllMessages();
          var freshState = getState();
          var currentVisible = getVisibleAssistantTurns(msgs, freshState.ghostedIds);

          // When noSummarizeVerbatim is on, eligible turns are those outside the
          // verbatim window. Stop catchup when none remain unsummarized.
          // Use only VISIBLE turns
          var catchupEligibleCount = settings.noSummarizeVerbatim
          ? Math.max(0, currentVisible.length - settings.verbatimTurns) : currentVisible.length;
          if (catchupEligibleCount === 0 || currentVisible.length <= settings.verbatimTurns) break;

          var success = await summarizeOneBatch(msgs);

          if (success === null) {
            // Nothing eligible left to summarize. Not a failure.
            break;
          } else if (success) {
            window._scEmptyCount = 0; // Reset counter
            window._scLastErrorMsg = null;
            completed++;
            consecutiveFailures = 0;
          } else {
            failed++;
            consecutiveFailures++;

            if (window._scFailReason === 'empty') {
              window._scEmptyCount = (window._scEmptyCount || 0) + 1;
            } else {
              window._scEmptyCount = 0;
            }

            if (window._scEmptyCount >= 3) {
              tavo.utils.toast(t('toast.threeEmptyPause'));
              break;
            }
            if (consecutiveFailures >= 10) {
              tavo.utils.toast(t('toast.tenErrorsPause', {err: (window._scLastErrorMsg || 'unknown')}));
              break;
            }
          }

          var pct = Math.round((completed / totalBatches) * 100);
          if (completed % 3 === 0) {
            tavo.utils.toast(t('toast.catchupProgress', {count: completed, total: totalBatches, pct: pct}));
          }

          await sleep(3000);
        }

        if (cancelled) {
          tavo.utils.toast(t('toast.catchupPaused', {count: completed, total: totalBatches}));
        } else if (failed === 0) {
          tavo.utils.toast(t('toast.catchupComplete', {count: completed}));
        } else {
          tavo.utils.toast(t('toast.catchupMixed', {ok: completed, failed: failed}));
        }
      } finally {
        _isSummarizing = false;
        await updateInjection();
        if (_panelOpen) renderAll();
      }
    }
    
    // ––––– Core: maybePromoteLayer
    // When a layer reaches snippetsPerLayer, promote ALL snippets except the newest `snippetsKeptAfterPromotion` ones (0 = flush everything), split across `snippetsPerPromotion` summarizer calls.
    async function maybePromoteLayer(layerIndex) {
      // Re-entrancy guard: if a promotion loop is already running for this
      // exact layer, bail out instead of racing it. Without this, cascade
      // recursion (line below: maybePromoteLayer(layerIndex + 1)) combined
      // with a second, unrelated caller entering maybePromoteLayer(0) could
      // both read the same layer array before either had spliced/saved,
      // and both would independently merge + push the same snippets to the
      // next layer — producing duplicate "Merged N from L0" entries.
      if (_promotingLayers[layerIndex]) return;
      _promotingLayers[layerIndex] = true;

      try {
      var settings = await getEffectiveSettings();
      var state = getState();

      if (layerIndex >= settings.maxLayers - 1) return;
      var layer = ensureLayer(state, layerIndex);
      if (layer.length < settings.snippetsPerLayer) return;

      // How many snippets to keep in this layer (the newest ones, at the end).
      var kept = Math.max(0, settings.snippetsKeptAfterPromotion || 0);

      // Backstop against double-merging: every snippet actually merged by
      // this function has its sid recorded here permanently. Even if a
      // save gets lost/reordered and a not-yet-spliced copy of a snippet
      // reappears in the layer array, we refuse to select or merge a sid
      // that's already in this set — so the same snippet can never produce
      // two merge results, independent of any array-splice bookkeeping.
      if (!Array.isArray(state.mergedSnippetSids)) state.mergedSnippetSids = [];

      // Backfill sids for any legacy snippets that predate the id system,
      // so every snippet in the layer is uniquely addressable before we
      // pick a batch.
      state = getState();
      layer = ensureLayer(state, layerIndex);
      var backfilled = false;
      for (var bi = 0; bi < layer.length; bi++) {
        if (!layer[bi].sid) { layer[bi].sid = nextSnippetId(state); backfilled = true; }
      }
      if (backfilled) saveState(state);

      // snippetsPerPromotion = how many summarizer CALLS to split the flush
      // into, not the batch size. e.g. layer of 20, kept 0, snippetsPerPromotion 4
      // -> batchSize = ceil(20/4) = 5 snippets per call, 4 calls total.
      var toPromoteTotal = Math.max(0, layer.length - kept);
      var numBatches = Math.max(1, settings.snippetsPerPromotion || 1);
      var batchSize = Math.max(1, Math.ceil(toPromoteTotal / numBatches));

      // Freeze the exact list of sids eligible for promotion in THIS call,
      // decided once from a single fresh read (oldest-first, excluding the
      // newest `kept`). Every subsequent step selects and removes snippets
      // by sid membership in this frozen queue — never by array index/splice
      // — so a stale re-read of the layer can't cause the same snippet to
      // be picked into two different batches.
      // Pinned snippets are never promoted regardless of position
      var eligibleSids = layer.slice(0, Math.max(0, layer.length - kept))
        .filter(function (sn) { return !sn.pinned; })
        .map(function (sn) { return sn.sid; });

      while (eligibleSids.length > 0) {
        var thisBatchSids = eligibleSids.splice(0, Math.min(batchSize, eligibleSids.length));

        // Re-read fresh state and pull out exactly the snippets whose sid
        // is in this batch AND not already recorded as merged. If a sid
        // vanished (already promoted by a concurrent path) or was already
        // merged per the backstop set, it's simply skipped rather than
        // re-merged.
        state = getState();
        if (!Array.isArray(state.mergedSnippetSids)) state.mergedSnippetSids = [];
        layer = ensureLayer(state, layerIndex);

        var sidSet = {};
        for (var si = 0; si < thisBatchSids.length; si++) sidSet[thisBatchSids[si]] = true;
        var mergedSet = {};
        for (var mi = 0; mi < state.mergedSnippetSids.length; mi++) mergedSet[state.mergedSnippetSids[mi]] = true;

        var toMerge = [];
        var remaining = [];
        for (var li = 0; li < layer.length; li++) {
          var sn = layer[li];
          if (sidSet[sn.sid] && !mergedSet[sn.sid]) {
            toMerge.push(sn);
          } else {
            remaining.push(sn);
          }
        }

        if (toMerge.length === 0) {
          // Nothing left to do for this batch (already merged elsewhere,
          // or removed) — don't call the summarizer or save anything.
          continue;
        }

        // Commit the removal immediately, atomically with marking these
        // sids as merged, so no other path can pick them up while the
        // summarizer call below is in flight.
        state.layers[layerIndex] = remaining;
        for (var tm = 0; tm < toMerge.length; tm++) {
          state.mergedSnippetSids.push(toMerge[tm].sid);
        }
        saveState(state);

        var storyTxt = toMerge.map(function (sn) { return sn.text; }).join(' ');
        var contextStr = buildFullContext(state, layerIndex + 1);

        tavo.utils.toast(t('toast.promoting', {count: toMerge.length, from: layerIndex, to: layerIndex + 1}));

        var mergeResult = await callSummarizer(storyTxt, contextStr, settings);
        if (!mergeResult || !mergeResult.text) {
          // LLM failed — restore the batch (and un-mark it as merged) so it
          // can be retried on a future pass, then abort this flush.
          state = getState();
          if (!Array.isArray(state.mergedSnippetSids)) state.mergedSnippetSids = [];
          state.mergedSnippetSids = state.mergedSnippetSids.filter(function (sid) { return !sidSet[sid]; });
          ensureLayer(state, layerIndex).unshift.apply(ensureLayer(state, layerIndex), toMerge);
          saveState(state);
          break;
        }

        state = getState();
        ensureLayer(state, layerIndex + 1).push({
          sid: nextSnippetId(state),
          text: mergeResult.text,
          fromLayer: layerIndex,
          mergedCount: toMerge.length,
          mergedSids: toMerge.map(function (sn) { return sn.sid; }),
          // Turn ranges of the merged L0 snippets (undefined entries for
          // any deeper-layer snippet that has no direct turnRange of its
          // own) — shown in the panel so it's visible at a glance which
          // raw turns a merge covers, and easy to spot duplicate/overlapping
          // merges.
          sourceTurnRanges: toMerge.map(function (sn) { return sn.turnRange || null; }),
          sourceTexts: toMerge.map(function (sn) { return sn.text; }),
          timestamp: Date.now()
        });
        saveState(state);
      }

      // Cascade: if the destination layer is now also over threshold, flush it too
      state = getState();
      if (ensureLayer(state, layerIndex + 1).length >= settings.snippetsPerLayer) {
        await maybePromoteLayer(layerIndex + 1);
      }
      } finally {
        _promotingLayers[layerIndex] = false;
      }
    }
    
    // ––––– Polling
    async function poll() {
      try {
        if (typeof tavo === 'undefined') return;
        applyFabVisibility();
        var settings = await getEffectiveSettings();

        if (_debugVerbose && _debugEnabled) {
          var snap = _debugGetStateSnapshot();
          console.debug('[sc:poll] tick — enabled=' + settings.enabled + ' paused=' + settings.pauseSummarization +
            ' summarizing=' + _isSummarizing + ' summarizedUpTo=' + snap.summarizedUpTo +
            ' snippets=' + snap.totalSnippets + ' ghosted=' + snap.ghostedIds +
            ' lastMsgCount=' + snap.lastMsgCount);
        }

        if (!settings.enabled || settings.pauseSummarization) {
          await updateInjection();
          return;
        }

        var count = await tavo.message.count();
        var state = getState();

        if (count > state.lastMessageCount) {
          // New messages arrived
          patchState({ lastMessageCount: count });
          await maybeSummarizeTurns();
        } else if (count < state.lastMessageCount) {
          // Chat switch or message deletion
          patchState({ lastMessageCount: count });
          _catchupDismissed = false;
        }

        var floorMsgs = await getAllMessages();
        await enforceVerbatimFloor(floorMsgs, settings);

        await updateInjection();

        // Keep the LTM toggle in sync with Tavo's live state while the panel
        // is open, in case it was flipped from Tavo's own UI (or another
        // tab) rather than from here.
        if (_panelOpen) await refreshLtmToggleUI();
      } catch (e) {
        // Silent — poll failures are non-critical
      }
    }
    // Lightweight sync for just the LTM toggle — avoids a full renderAll() on every poll tick.
    async function refreshLtmToggleUI() {
      try {
        var ltmToggle = document.getElementById('sc-ltm-toggle');
        if (!ltmToggle || document.activeElement === ltmToggle) return;
        var mem = await getLtmMemory();
        if (!!ltmToggle.checked !== !!mem.enabled) {
          ltmToggle.checked = !!mem.enabled;
          // The user flipped LTM in Tavo's own sidebar while the panel was open.
          // Persist that change into the per-chat config so updateInjection()
          // respects it as the authoritative preference for this chat.
          if (isPerChatSettingsEnabled()) {
            setChatConfig({ ltmEnabled: !!mem.enabled });
          } else {
            setConfig({ nativeMemoryManual: true, ltmEnabled: !!mem.enabled });
            _configCache = getConfig();
          }
        }
      } catch (e) {}
    }
    function startPolling() {
      if (_pollTimer) clearInterval(_pollTimer);
      // Initial count sync without triggering summarization
      (async function () {
        try {
          if (typeof tavo !== 'undefined') {
            var count = await tavo.message.count();
            var state = getState();
            if (state.lastMessageCount === 0) {
              patchState({ lastMessageCount: count });
            }
            // Run branch repair on load
            var msgs = await getAllMessages();
            await repairIfBranched(msgs);
            await updateInjection();
          }
        } catch (e) {}
      })();

      _pollTimer = setInterval(poll,
        8000);
    }

    // ––––– Rendering
    async function renderAll() {

      var state = getState();
      var ltmMemory = await getLtmMemory();

      // ––––– Main scrollable body (sc-body) –––––
      var html = '';
      html += tplStatusRow(settings,
        _isSummarizing, state);
      html += tplActionsRow(_isSummarizing);

      // Stats
      var totalSnippets = 0;
      if (state.layers) {
        for (var i = 0; i < state.layers.length; i++) {
          if (state.layers[i]) totalSnippets += state.layers[i].length;
        }
      }
      var actualHiddenCount = state.ghostedIds.length;
      try {
        var hm = await tavo.message.find([], {
          hidden: true
        }); if (Array.isArray(hm)) actualHiddenCount = hm.length;
      } catch(e) {}
      var ghostSub = state.ghostedIds.length !== actualHiddenCount ? t('stats.trackedSub', {count: state.ghostedIds.length}): t('stats.hiddenFromLlm');
      html += tplStatsSection(totalSnippets, state.layers ? state.layers.length: 0, actualHiddenCount, ghostSub, state.layers, settings.snippetsPerLayer);

      html += tplSnippetBrowser(state.layers);

      // ––––– Everything below goes into the sticky footer, not sc-body –––––
      // Triggered Memories now lives here too, glued to the bottom like Injection
      // Preview: it expands upward over the sticky footer instead of pushing
      // content down inside sc-body.
      var stickyHtml = '';

      stickyHtml += tplTriggeredMemories(_lastTriggered, settings.triggeredMemoriesEnabled);

      var preview = assembleSummaryBlock(state);
      stickyHtml += tplPreviewSection(preview);

      var globalCfg = _configCache || getConfig();
      var perChatEnabled = isPerChatSettingsEnabled();
      var chatCfg = perChatEnabled ? getChatConfig() : null;
      // scfg: the config object used for rendering current settings values.
      // In per-chat mode, show per-chat values if saved; otherwise show manifest defaults.
      var scfg;
      if (perChatEnabled) {
        var manifestDefs = getManifestDefaults();
        scfg = Object.assign({}, DEFAULT_SETTINGS, manifestDefs, chatCfg || {});
        // Always pull global-only keys from globalCfg for the API tab rendering
        scfg.customApis = globalCfg.customApis;
        scfg.activeCustomApiId = globalCfg.activeCustomApiId;
        scfg.useCustomApi = globalCfg.useCustomApi;
      } else {
        scfg = globalCfg;
      }
      var promptPreset = cfgVal(scfg, 'promptPreset');
      var customPrompt = getCustomPrompt();
      var secondaryPrompt = getSecondaryPrompt();
      var settingsOpen = _settingsOpen;
      var customApis = getCustomApis();
      var activeCapiId = globalCfg.activeCustomApiId || null;

      stickyHtml += tplSettingsSection({
        settingsOpen: settingsOpen,
        settingsTab: _settingsTab,
        scfg: scfg,
        promptPreset: promptPreset,
        customPrompt: customPrompt,
        secondaryPrompt: secondaryPrompt,
        customApis: customApis,
        activeCapiId: activeCapiId,
        capiEditingId: _capiEditingId,
        ltmEnabled: ltmMemory.enabled,
        perChatEnabled: perChatEnabled,
        hasChatConfig: !!(chatCfg && Object.keys(chatCfg).length > 0)
      });

      body.innerHTML = html;
      var stickyScroll = document.getElementById('sc-sticky-footer-scroll');
      if (stickyScroll) stickyScroll.innerHTML = stickyHtml;

      // Debug panel lives outside the scroll area so it always sticks to the
      // bottom of the sticky footer, even when settings is expanded.
      var stickyFooterEl = document.getElementById('sc-sticky-footer');
      var debugContainer = document.getElementById('sc-debug-container');
      if (!debugContainer && stickyFooterEl) {
        debugContainer = document.createElement('div');
        debugContainer.id = 'sc-debug-container';
        debugContainer.style.cssText = 'padding: 0 16px 14px; margin-top: 5px; flex: 0 0 auto;';
        stickyFooterEl.appendChild(debugContainer);
      }
      if (debugContainer) debugContainer.innerHTML = tplDebugSection();

      footer.textContent = '';

      bindPanelEvents();
      bindResizeHandles();
    }
    function bindPanelEvents() {
      var forceBtn = document.getElementById('sc-btn-force');
      var stopBtn = document.getElementById('sc-btn-stop');
      var repairBtn = document.getElementById('sc-btn-repair');
      var exportBtn = document.getElementById('sc-btn-export');
      var importBtn = document.getElementById('sc-btn-import');
      var clearBtn = document.getElementById('sc-btn-clear');

        if (stickyFooterEl) stickyFooterEl.classList.toggle('settings-expanded', isInitiallyOpen);
        if (panelEl) panelEl.classList.toggle('settings-open', isInitiallyOpen);

          (function(el) {

            });
          })(hideable[i]);

        settingsHeader.addEventListener('click', function () {

          if (sf) sf.classList.toggle('settings-expanded', isOpen);
          if (panelEl) panelEl.classList.toggle('settings-open', isOpen);

      // ––––– Unsaved-changes pill –––––
      // Delegated listener over the whole settings section: any field change
      // (toggle, number, textarea, or preset pill) marks settings dirty and
      // reveals the pill next to Save Settings. Reset on save and on re-render.
      _settingsDirty = false;
      var unsavedPill = document.getElementById('sc-unsaved-pill');
      function markSettingsDirty() {
        if (_settingsDirty) return;
        _settingsDirty = true;
        if (unsavedPill) unsavedPill.style.display = 'inline-flex';
      }
      var settingsSection = document.getElementById('sc-settings-body');
      if (settingsSection) {
        // sc-ltm-toggle writes straight to Tavo on change (see its own
        // handler) and is never part of the Save Settings batch, so it's
        // excluded here — flipping it shouldn't raise the unsaved-changes pill.
        var EXCLUDED_DIRTY_IDS = { 'sc-cfg-save': true, 'sc-ltm-toggle': true };
        settingsSection.addEventListener('input', function (e) {
          if (e.target && !EXCLUDED_DIRTY_IDS[e.target.id]) markSettingsDirty();
        });
        settingsSection.addEventListener('change', function (e) {
          if (e.target && !EXCLUDED_DIRTY_IDS[e.target.id]) markSettingsDirty();
        });
        // Preset pill buttons (prompt style / secondary prompt) aren't <input>
        // elements, so they don't fire input/change — bind them directly.
        settingsSection.querySelectorAll('.sc-pill[data-preset], .sc-pill[data-secondary-preset]').forEach(function (pill) {
          pill.addEventListener('click', markSettingsDirty);
        });
      }

      // Collapsible stats section
      var statsHeader = document.getElementById('sc-stats-header');
      var statsBody = document.getElementById('sc-stats-body');

        statsHeader.addEventListener('click', function () {
          _statsOpen = !_statsOpen;
          statsHeader.classList.toggle('is-open', _statsOpen);
          statsBody.classList.toggle('is-open', _statsOpen);
        });

      // Collapsible injection preview section
      var previewHeader = document.getElementById('sc-preview-header');
      var previewBody = document.getElementById('sc-preview-body');
      if (previewHeader && previewBody) {
        previewHeader.addEventListener('click', function () {
          _previewOpen = !_previewOpen;
          previewHeader.classList.toggle('is-open', _previewOpen);
          previewBody.classList.toggle('is-open', _previewOpen);

      // Collapsible snippet browser section
      var snippetsHeader = document.getElementById('sc-snippets-header');

        snippetsHeader.addEventListener('click', function (e) {

          snippetsHeader.classList.toggle('is-open', _snippetsOpen);
          snippetsBody.classList.toggle('is-open', _snippetsOpen);

      // Add custom snippet button
      var snippetAddBtn = document.getElementById('sc-snippet-add-btn');
      if (snippetAddBtn) {
        snippetAddBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          _addingCustomSnippet = true;
          _snippetsOpen = true;
          renderAll();

          setTimeout(function () {

          }, 50);
