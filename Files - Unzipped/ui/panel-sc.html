      // Add custom snippet form: cancel
      var snippetAddCancel = document.getElementById('sc-snippet-add-cancel');
      if (snippetAddCancel) {
        snippetAddCancel.addEventListener('click', function () {
          _addingCustomSnippet = false;
          renderAll();
        });
      }

      // Add custom snippet form: save
      var snippetAddSave = document.getElementById('sc-snippet-add-save');
      if (snippetAddSave) {
        snippetAddSave.addEventListener('click', async function () {
          var ta = document.getElementById('sc-snippet-add-ta');
          var text = ta ? ta.value.trim() : '';
          if (!text) {
            tavo.utils.toast('Please enter some text for the snippet.');
            return;
          }
          snippetAddSave.disabled = true;
          snippetAddSave.textContent = 'Adding...';
          try {
            var state = getState();
            var entry = {
              sid: nextSnippetId(state),
              text: text,
              tags: [],
              timestamp: Date.now(),
              custom: true,
              pinned: true
            };
            ensureLayer(state, 0).push(entry);
            saveState(state);
            await updateInjection();
            _addingCustomSnippet = false;
            tavo.utils.toast('Custom snippet added.');
          } finally {
            if (snippetAddSave) {
              snippetAddSave.disabled = false;
              snippetAddSave.textContent = 'Add Snippet';
            }
            renderAll();
          }
        });
      }

      // Add custom snippet form: save on Ctrl+Enter / Cmd+Enter
      var snippetAddTa = document.getElementById('sc-snippet-add-ta');
      if (snippetAddTa) {
        snippetAddTa.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            var saveBtn = document.getElementById('sc-snippet-add-save');
            if (saveBtn && !saveBtn.disabled) saveBtn.click();
          } else if (e.key === 'Escape') {
            _addingCustomSnippet = false;
            renderAll();
          }
        });
      }

      // Collapsible triggered memories section
      var triggeredHeader = document.getElementById('sc-triggered-header');
      var triggeredBody = document.getElementById('sc-triggered-body');
      if (triggeredHeader && triggeredBody) {
        triggeredHeader.addEventListener('click', function () {
          _triggeredOpen = !_triggeredOpen;
          triggeredHeader.classList.toggle('is-open', _triggeredOpen);
          triggeredBody.classList.toggle('is-open', _triggeredOpen);
        });
      }

      // ––––– Debug panel events
      var debugHeader = document.getElementById('sc-debug-header');
      var debugBody = document.getElementById('sc-debug-body');
      var debugContainerEl = document.getElementById('sc-debug-container');
      if (debugHeader && debugBody) {
        // Apply initial state (e.g. after renderAll while already open)
        var sfEl = document.getElementById('sc-sticky-footer');
        var panelEl2 = document.querySelector('#sc-overlay .sc-panel');
        if (_debugOpen) {
          debugHeader.classList.add('is-open');
          debugBody.classList.add('is-open');
          if (sfEl) sfEl.classList.add('debug-expanded');
          if (panelEl2) panelEl2.classList.add('debug-open');
          if (debugContainerEl) debugContainerEl.classList.add('debug-expanded');
          var hideable2 = body.querySelectorAll('.sc-section.sc-hideable');
          for (var j = 0; j < hideable2.length; j++) hideable2[j].classList.add('sc-hidden');
        }
        debugHeader.addEventListener('click', function () {
          _debugOpen = !_debugOpen;
          debugHeader.classList.toggle('is-open', _debugOpen);
          debugBody.classList.toggle('is-open', _debugOpen);
          var sf2 = document.getElementById('sc-sticky-footer');
          var pnl = document.querySelector('#sc-overlay .sc-panel');
          var dbgC = document.getElementById('sc-debug-container');
          if (sf2) sf2.classList.toggle('debug-expanded', _debugOpen);
          if (pnl) pnl.classList.toggle('debug-open', _debugOpen);
          if (dbgC) dbgC.classList.toggle('debug-expanded', _debugOpen);
          // Hide / restore the main body sections while debug is open
          var hid = body.querySelectorAll('.sc-section.sc-hideable');
          for (var k = 0; k < hid.length; k++) hid[k].classList.toggle('sc-hidden', _debugOpen);
          if (_debugOpen) {
            // Scroll log to bottom when opened
            setTimeout(function () {
              var logEl = document.getElementById('sc-debug-log');
              if (logEl) logEl.scrollTop = logEl.scrollHeight;
            }, 30);
          }
        });
      }

      // Capture toggle
      var captureToggle = document.getElementById('sc-debug-capture');
      if (captureToggle) {
        captureToggle.addEventListener('change', function () {
          _debugEnabled = captureToggle.checked;
          if (_debugEnabled) {
            _debugInstallHooks();
            console.info('[sc:debug] Console capture enabled.');
          } else {
            _debugRemoveHooks();
            _debugOrigConsole.info('[sc:debug] Console capture disabled.');
          }
          _debugRenderEntries();
          var badge = document.getElementById('sc-debug-badge');
          if (badge) { badge.textContent = _debugLog.length; badge.style.display = _debugLog.length ? '' : 'none'; }
        });
      }

      // Verbose toggle
      var verboseToggle = document.getElementById('sc-debug-verbose');
      if (verboseToggle) {
        verboseToggle.addEventListener('change', function () {
          _debugVerbose = verboseToggle.checked;
          if (_debugEnabled) console.info('[sc:debug] Verbose mode ' + (_debugVerbose ? 'enabled' : 'disabled') + '.');
        });
      }

      // Filter pills
      document.querySelectorAll('#sc-overlay .sc-debug-filter-pill[data-debug-filter]').forEach(function (pill) {
        pill.addEventListener('click', function () {
          var lvl = pill.getAttribute('data-debug-filter');
          _debugFilters[lvl] = !_debugFilters[lvl];
          pill.classList.toggle('active', _debugFilters[lvl]);
          _debugRenderEntries();
        });
      });

      // Clear button
      var debugClearBtn = document.getElementById('sc-debug-clear');
      if (debugClearBtn) {
        debugClearBtn.addEventListener('click', function () {
          _debugLog = [];
          try { if (typeof tavo !== 'undefined') tavo.set(_DEBUG_STORAGE_KEY, [], 'chat'); } catch(e) {}
          _debugRenderEntries();
          var badge = document.getElementById('sc-debug-badge');
          if (badge) { badge.textContent = '0'; badge.style.display = 'none'; }
          // Update the logEntries info card in the snapshot grid immediately
          var cards = document.querySelectorAll('#sc-debug-container .sc-debug-info-card');
          for (var ci = 0; ci < cards.length; ci++) {
            var label = cards[ci].querySelector('.sc-debug-info-label');
            if (label && label.textContent === 'logEntries') {
              var val = cards[ci].querySelector('.sc-debug-info-value');
              if (val) val.textContent = '0';
              break;
            }
          }
        });
      }

      // Copy button
      var debugCopyBtn = document.getElementById('sc-debug-copy');
      if (debugCopyBtn) {
        debugCopyBtn.addEventListener('click', function () {
          var txt = _debugLog.map(function (e) {
            return '[' + e.ts + '] [' + e.level.toUpperCase() + '] ' + e.msg;
          }).join('\n');
          if (!txt) { if (_debugEnabled) { tavo.utils.toast('Log is empty.'); } else { tavo.utils.toast('Enable capture first.'); } return; }
          try {
            navigator.clipboard.writeText(txt).then(function () {
              tavo.utils.toast('Debug log copied to clipboard (' + _debugLog.length + ' entries).');
            }).catch(function () {
              // fallback: show in a temp textarea
              var ta = document.createElement('textarea');
              ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
              document.body.appendChild(ta); ta.focus(); ta.select();
              document.execCommand('copy');
              document.body.removeChild(ta);
              tavo.utils.toast('Debug log copied (' + _debugLog.length + ' entries).');
            });
          } catch(e) { tavo.utils.toast('Copy failed: ' + e.message); }
        });
      }

      // Refresh / state snapshot button
      var debugRefreshBtn = document.getElementById('sc-debug-refresh');
      if (debugRefreshBtn) {
        debugRefreshBtn.addEventListener('click', function () {
          if (_debugEnabled) {
            var snap = _debugGetStateSnapshot();
            console.info('[sc:debug] State snapshot:', snap);
          }
          renderAll();
        });
      }

      // Native long-term memory toggle (Tavo's actual memory system, not the plugin).
      // This writes straight to tavo.memory and never touches sc_config's
      // 'enabled' value — SC only tracks that the user has taken manual control
      // (nativeMemoryManual) so updateInjection() knows to leave the flag alone
      // and mirror whatever Tavo itself reports on future polls/renders.
      var ltmToggle = document.getElementById('sc-ltm-toggle');
      if (ltmToggle) ltmToggle.addEventListener('change', async function () {
        var checked = ltmToggle.checked;
        ltmToggle.disabled = true;
        try {
          var mem = await getLtmMemory();
          mem.enabled = checked;
          await tavo.memory.update(mem);
          _ltmMemoryCache = mem;
          _lastInjectedKey = null; // force next updateInjection() to write through
          // Persist the user's explicit LTM choice so updateInjection() never
          // reverts it. In per-chat mode, save to sc_chat_config (chat scope) so
          // each chat remembers its own preference. In global mode, mark
          // nativeMemoryManual on the global config as before.
          if (isPerChatSettingsEnabled()) {
            setChatConfig({ ltmEnabled: checked });
          } else {
            setConfig({ nativeMemoryManual: true, ltmEnabled: checked });
            _configCache = getConfig();
          }
          tavo.utils.toast(checked ? t('toast.ltmEnabled'): t('toast.ltmDisabled'));
        } catch (e) {
          console.error('[sc] failed to toggle native memory:', e);
          ltmToggle.checked = !checked;
          tavo.utils.toast(t('toast.ltmUpdateFailed'));
        } finally {
          ltmToggle.disabled = false;
        }
      });

      // Number stepper buttons
      document.querySelectorAll('#sc-overlay .sc-num-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var input = document.getElementById(btn.getAttribute('data-target'));
          if (!input) return;
          var delta = parseInt(btn.getAttribute('data-delta'), 10);
          var val = parseInt(input.value, 10) || 0;
          var min = parseInt(input.min, 10); var max = parseInt(input.max, 10);
          input.value = Math.max(min, Math.min(max, val + delta));
          // Programmatic .value writes don't fire input/change, so the
          // delegated dirty-tracking listener never sees this — dispatch
          // one manually so +/- clicks also raise the unsaved-changes pill.
          input.dispatchEvent(new Event('input', { bubbles: true }));
        });
      });

      // Prompt style pills
      // Prompt style pills
      document.querySelectorAll('#sc-overlay .sc-pill[data-preset]').forEach(function (pill) {
        pill.addEventListener('click',
          function () {
            document.querySelectorAll('#sc-overlay .sc-pill[data-preset]').forEach(function (p) {
              p.classList.remove('active');
            });
            pill.classList.add('active');
            var wrap = document.getElementById('sc-custom-prompt-wrap');
            if (wrap) wrap.classList.toggle('is-open', pill.getAttribute('data-preset') === 'custom');
          });
      });

      // Secondary prompt style pills — Light / Heavy / Custom
      document.querySelectorAll('#sc-overlay .sc-pill[data-secondary-preset]').forEach(function (pill) {
        pill.addEventListener('click',
          function () {
            document.querySelectorAll('#sc-overlay .sc-pill[data-secondary-preset]').forEach(function (p) {
              p.classList.remove('active');
            });
            pill.classList.add('active');
            var wrap = document.getElementById('sc-secondary-prompt-wrap');
            if (wrap) wrap.classList.toggle('is-open', pill.getAttribute('data-secondary-preset') === 'custom');
          });
      });

      // Settings tab switching
      document.querySelectorAll('#sc-overlay .sc-settings-tab[data-settings-tab]').forEach(function (tab) {
        tab.addEventListener('click',
          function () {
            _settingsTab = tab.getAttribute('data-settings-tab');
            _capiEditingId = null;
            renderAll();
          });
      });

      // Custom API: select active
      document.querySelectorAll('#sc-overlay .sc-capi-radio[data-id]').forEach(function (radio) {
        radio.addEventListener('change',
          function () {
            setConfig({
              activeCustomApiId: radio.getAttribute('data-id')
            });
            renderAll();
          });
      });

      // Custom API: add
      var capiAddBtn = document.getElementById('sc-capi-add');
      if (capiAddBtn) capiAddBtn.addEventListener('click', function () {
        _capiEditingId = 'new'; renderAll();
      });

      // Custom API: edit
      document.querySelectorAll('#sc-overlay [data-capi-edit]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          _capiEditingId = btn.getAttribute('data-capi-edit'); renderAll();
        });
      });

      // Custom API: cancel form
      var capiCancelBtn = document.getElementById('sc-capi-cancel');
      if (capiCancelBtn) capiCancelBtn.addEventListener('click', function () {
        _capiEditingId = null; renderAll();
      });

      // Custom API: show/hide key toggle (local-only field, no need to re-render)
      var capiKeyToggleBtn = document.getElementById('sc-capi-key-toggle');
      if (capiKeyToggleBtn) {
        capiKeyToggleBtn.addEventListener('click', function () {
          var keyInput = document.getElementById('sc-capi-key');
          if (!keyInput) return;
          var isHidden = keyInput.type === 'password';
          keyInput.type = isHidden ? 'text': 'password';
          capiKeyToggleBtn.querySelector('.sc-gicon').textContent = isHidden ? 'visibility_off': 'visibility';
          capiKeyToggleBtn.title = isHidden ? 'Hide API key': 'Show API key';
        });
      }

      // Custom API: live-update slider value labels while dragging
      var capiFormEl = document.getElementById('sc-capi-form');
      if (capiFormEl) {
        capiFormEl.querySelectorAll('input[type="range"]').forEach(function (slider) {
          var valEl = document.getElementById(slider.id + '-val');
          if (!valEl) return;
          slider.addEventListener('input', function () {
            if (slider.id === 'sc-capi-maxtok' && slider.value === '0') {
              valEl.textContent = t('capi.unlimited');
            } else {
              valEl.textContent = slider.value;
            }
          });
        });
      }

      // Custom API: save form
      var capiSaveBtn = document.getElementById('sc-capi-save');
      if (capiSaveBtn) capiSaveBtn.addEventListener('click', function () {
        var name = (document.getElementById('sc-capi-name').value || '').trim();
        var url = (document.getElementById('sc-capi-url').value || '').trim();
        var model = (document.getElementById('sc-capi-model').value || '').trim();
        if (!name || !url || !model) {
          tavo.utils.toast(t('toast.apiFieldsRequired')); return;
        }
        var profile = {
          id: capiSaveBtn.getAttribute('data-editing-id') || null,
          name: name,
          url: url,
          model: model,
          apiKey: (document.getElementById('sc-capi-key').value || '').trim(),
          temperature: parseFloat(document.getElementById('sc-capi-temp').value) || 0,
          topP: parseFloat(document.getElementById('sc-capi-topp').value),
          maxTokens: parseInt(document.getElementById('sc-capi-maxtok').value, 10) || 0,
          frequencyPenalty: parseFloat(document.getElementById('sc-capi-freqpen').value) || 0,
          presencePenalty: parseFloat(document.getElementById('sc-capi-prespen').value) || 0,
          timeoutSec: parseInt(document.getElementById('sc-capi-timeout').value, 10) || 60
        };
        if (!profile.id) delete profile.id;
        upsertCustomApi(profile);
        _capiEditingId = null;
        tavo.utils.toast(t('toast.apiSaved'));
        renderAll();
      });

      // Custom API: delete
      document.querySelectorAll('#sc-overlay [data-capi-del]').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          var id = btn.getAttribute('data-capi-del');
          var ok = await showInlineConfirm(btn, {
            title: t('confirm.deleteApi.title'), message: t('confirm.deleteApi.message'), confirmLabel: t('btn.delete')
          });
          if (!ok) return;
          deleteCustomApi(id);
          renderAll();
        });
      });

      // Reset per-chat settings button
      var resetChatBtn = document.getElementById('sc-cfg-reset-chat');
      if (resetChatBtn) resetChatBtn.addEventListener('click', async function () {
        var confirmPromise = showInlineConfirm(resetChatBtn.closest('.sc-perchat-bar'), {
          title: 'Reset Chat Settings',
          message: 'Remove per-chat settings for this chat and revert to the global defaults?',
          confirmLabel: 'Reset',
          icon: 'restart_alt'
        });
        
        // Fix the padding that gets destroyed by the #sc-settings-body
        var inlineBar = document.querySelector('.sc-confirm-inline');
        if (inlineBar) {
          inlineBar.style.padding = '8px';
        }
        
        var ok = await confirmPromise;
        if (!ok) return;
        clearChatConfig();
        _configCache = getConfig();
        tavo.utils.toast('Per-chat settings cleared. Using defaults.');
        renderAll();
      });



      // Reset global settings to defaults
      var resetDefaultsBtn = document.getElementById('sc-cfg-reset-defaults');
      if (resetDefaultsBtn) resetDefaultsBtn.addEventListener('click', async function () {
        var saveBar = document.getElementById('sc-settings-save-bar');
        var ok = await showInlineConfirm(saveBar, {
          title: 'Reset to Defaults',
          message: 'Reset all settings to their factory defaults? Custom API config will not be affected.',
          confirmLabel: 'Reset',
          icon: 'restart_alt'
        });
        if (!ok) return;
        // Preserve global-only keys that must not be wiped
        var globalCfg = _configCache || getConfig();
        var preserved = {};
        for (var k in GLOBAL_ONLY_KEYS) {
          if (GLOBAL_ONLY_KEYS.hasOwnProperty(k) && globalCfg[k] != null) preserved[k] = globalCfg[k];
        }
        setConfig(Object.assign({}, DEFAULT_SETTINGS, preserved));
        clearCustomPrompt();
        clearSecondaryPrompt();
        _configCache = getConfig();
        _settingsDirty = false;
        tavo.utils.toast('Settings reset to defaults.');
        renderAll();
      });

      // Save
      var saveSettingsBtn = document.getElementById('sc-cfg-save');
      if (saveSettingsBtn) saveSettingsBtn.addEventListener('click', async function () {
        var perChat = isPerChatSettingsEnabled();
        // Always read current global cfg for global-only keys; for per-chat mode we write a separate object
        var globalCfg = _configCache || getConfig();
        var prevDisableGhosting = perChat
          ? !!(getChatConfig() || {}).disableGhosting
          : !!globalCfg.disableGhosting;

        // Collect form values into a patch object
        var patch = {};
        patch.enabled = document.getElementById('sc-cfg-enabled').checked;
        patch.pauseSummarization = document.getElementById('sc-cfg-pause').checked;
        patch.disableGhosting = document.getElementById('sc-cfg-noghost').checked;
        patch.noSummarizeVerbatim = document.getElementById('sc-cfg-nosum-verbatim').checked;
        patch.verbatimTurns = Math.max(1, Math.min(30, parseInt(document.getElementById('sc-cfg-verbatim').value, 10) || DEFAULT_SETTINGS.verbatimTurns));
        patch.turnsPerSummary = Math.max(1, Math.min(10, parseInt(document.getElementById('sc-cfg-batch').value, 10) || DEFAULT_SETTINGS.turnsPerSummary));
        patch.snippetsPerLayer = Math.max(5, Math.min(100, parseInt(document.getElementById('sc-cfg-snippets').value, 10) || DEFAULT_SETTINGS.snippetsPerLayer));
        patch.snippetsPerPromotion = Math.max(1, Math.min(10, parseInt(document.getElementById('sc-cfg-promo').value, 10) || DEFAULT_SETTINGS.snippetsPerPromotion));
        patch.snippetsKeptAfterPromotion = Math.max(0, Math.min(50, parseInt(document.getElementById('sc-cfg-kept').value, 10) || 0));
        patch.maxLayers = Math.max(1, Math.min(100, parseInt(document.getElementById('sc-cfg-maxlayers').value, 10) || DEFAULT_SETTINGS.maxLayers));
        patch.triggeredMemoriesEnabled = document.getElementById('sc-cfg-triggered-enabled').checked;
        patch.autoRepair = document.getElementById('sc-cfg-autorepair').checked;
        patch.autoRepairInterval = Math.max(1, Math.min(20, parseInt(document.getElementById('sc-cfg-autorepair-interval').value, 10) || DEFAULT_SETTINGS.autoRepairInterval));
        patch.triggeredMemoryLookback = Math.max(1, Math.min(30, parseInt(document.getElementById('sc-cfg-recall-lookback').value, 10) || DEFAULT_SETTINGS.triggeredMemoryLookback));
        patch.triggeredMemoryCap = Math.max(1, Math.min(50, parseInt(document.getElementById('sc-cfg-recall-cap').value, 10) || DEFAULT_SETTINGS.triggeredMemoryCap));
        var activePill = overlay.querySelector('.sc-pill[data-preset].active');
        patch.promptPreset = activePill ? activePill.getAttribute('data-preset') : 'narrative';
        setCustomPrompt((document.getElementById('sc-cfg-customprompt') || {}).value || '');
        var secondaryEnabledEl = document.getElementById('sc-cfg-secondary-enabled');
        if (secondaryEnabledEl) patch.secondaryPromptEnabled = secondaryEnabledEl.checked;
        var secondaryActivePill = overlay.querySelector('.sc-pill[data-secondary-preset].active');
        patch.secondaryPromptPreset = secondaryActivePill ? secondaryActivePill.getAttribute('data-secondary-preset') : 'light';
        setSecondaryPrompt((document.getElementById('sc-cfg-secondaryprompt') || {}).value || '');

        // Custom API (useCustomApi) is always global — never written to chat scope
        var useCustomApiEl = document.getElementById('sc-cfg-usecustomapi');
        if (useCustomApiEl) {
          globalCfg.useCustomApi = useCustomApiEl.checked;
          setConfig({ useCustomApi: globalCfg.useCustomApi });
        }

        // LTM toggle: commit the current checkbox state explicitly on Save so
        // Save is the authoritative commit point. Writes to tavo.memory so the
        // live state is always in sync with the saved preference.
        var ltmToggleEl = document.getElementById('sc-ltm-toggle');
        var ltmChecked = ltmToggleEl ? ltmToggleEl.checked : null;
        if (ltmChecked !== null) {
          try {
            var ltmMem = await getLtmMemory();
            if (ltmMem.enabled !== ltmChecked) {
              ltmMem.enabled = ltmChecked;
              await tavo.memory.update(ltmMem);
              _ltmMemoryCache = ltmMem;
              _lastInjectedKey = null;
            }
            if (perChat) {
              setChatConfig({ ltmEnabled: ltmChecked });
            } else {
              setConfig({ nativeMemoryManual: true, ltmEnabled: ltmChecked });
              _configCache = getConfig();
              globalCfg = _configCache;
            }
          } catch (e) {
            console.error('[sc] save: failed to commit LTM state:', e);
          }
        }

        // Write to the right scope
        if (perChat) {
          setChatConfig(patch);
        } else {
          var cfg = globalCfg;
          Object.assign(cfg, patch);
          setConfig(cfg);
        }
        _configCache = getConfig();

        // Retroactively apply a disableGhosting flip to messages already processed.
        if (patch.disableGhosting !== prevDisableGhosting) {
          try {
            var msgs = await getAllMessages();
            if (patch.disableGhosting) {
              // Toggled ON: immediately restore all currently tracked ghosted messages.
              var countToUnhide = await unghostAllMessages(msgs);
              tavo.utils.toast(t('toast.messagesUnhidden', {count: countToUnhide}));
            } else {
              // Toggled OFF: re-hide everything that's been summarized so far.
              var state = getState();
              if (state.summarizedUpTo >= 0) {
                var countBefore = state.ghostedIds.length;
                await ghostMessagesUpTo(state.summarizedUpTo, msgs);
                var countHidden = getState().ghostedIds.length - countBefore;
                tavo.utils.toast(t('toast.messagesHidden', {count: countHidden}));
              }
            }
            await updateInjection();
            if (_panelOpen) renderAll();
          } catch (e) {
            console.error('[sc] retroactive ghosting toggle failed:', e);
          }
        }

        _settingsDirty = false;
        var pillEl = document.getElementById('sc-unsaved-pill');
        if (pillEl) pillEl.style.display = 'none';

        tavo.utils.toast(perChat ? 'Chat settings saved.' : t('toast.settingsSaved'));
        renderAll();
      });

      if (forceBtn) forceBtn.addEventListener('click', async function () {
        if (_isSummarizing) {
          tavo.utils.toast(t('toast.alreadySummarizing')); return;
        }

        // Lock state instantly
        _isSummarizing = true;
        _abortRequested = false;
        _catchupDismissed = false;

        renderAll();

          var state = getState();
          var settings = await getEffectiveSettings();
          var visibleTurns = getVisibleAssistantTurns(msgs, state.ghostedIds);
          if (visibleTurns.length === 0) {
            tavo.utils.toast(t('toast.noVisibleMessages'));
            return;
          }
          // Reset summarizedUpTo so ALL existing messages are eligible,
          // bypassing the verbatim threshold entirely.
          state.summarizedUpTo = -1;
          saveState(state);
          await runForceAll(msgs, settings);

      if (repairBtn) repairBtn.addEventListener('click', async function () {
        repairBtn.disabled = true;
        repairBtn.textContent = t('btn.repairing');
        try {
          var msgs = await getAllMessages();
          var state = getState();
          var currentIds = {};
          for (var i = 0; i < msgs.length; i++) currentIds[msgs[i].id] = true;

          var repaired = 0;
          var stateChanged = false;

          // Remove ghostedIds for messages that no longer exist
          var validGhosted = state.ghostedIds.filter(function (id) {
            return currentIds[id];
          });
          var removedGhosts = state.ghostedIds.length - validGhosted.length;
          if (removedGhosts > 0) {
            state.ghostedIds = validGhosted;
            repaired += removedGhosts;
            stateChanged = true;
          }

          // [REPAIR] Purge Layer 0 snippets whose turnRange references message IDs
          // that no longer exist in the chat (e.g. individually deleted messages,
          // not only full branch/swipe events that repairIfBranched handles).
          if (state.layers && state.layers[0]) {
            var beforePrune = state.layers[0].length;
            state.layers[0] = state.layers[0].filter(function (sn) {
              if (!sn.turnRange) return true;
              // Keep snippet only if BOTH endpoints still exist in the chat
              return currentIds[sn.turnRange[0]] && currentIds[sn.turnRange[1]];
            });
            var pruned = beforePrune - state.layers[0].length;
            if (pruned > 0) {
              repaired += pruned;
              stateChanged = true;
              console.log('[sc] Repair: pruned ' + pruned + ' orphan Layer 0 snippet(s) with missing message IDs');
              // Recalculate summarizedUpTo from whatever snippets remain
              if (state.layers[0].length > 0) {
                var maxEnd = -1;
                for (var si = 0; si < state.layers[0].length; si++) {
                  var snp = state.layers[0][si];
                  if (snp.turnRange && snp.turnRange[1] > maxEnd) maxEnd = snp.turnRange[1];
                }
                state.summarizedUpTo = maxEnd;
              } else {
                state.summarizedUpTo = -1;
              }
            }
          }

          if (stateChanged) saveState(state);

          // [REPAIR] Purge archive (Triggered Memories) entries whose turnRange
          // references message IDs that no longer exist — keeps the memory store
          // in sync with the live chat so deleted messages don't linger as
          // phantom triggered memories.
          try {
            var archive = getArchive();
            var cleanArchive = archive.filter(function (entry) {
              if (!entry.turnRange) return true;
              return currentIds[entry.turnRange[0]] && currentIds[entry.turnRange[1]];
            });
            var prunedArchive = archive.length - cleanArchive.length;
            if (prunedArchive > 0) {
              setArchiveFromFlat(cleanArchive);
              repaired += prunedArchive;
              console.log('[sc] Repair: pruned ' + prunedArchive + ' orphan archive entry/entries with missing message IDs');
            }
          } catch (e) {
            console.warn('[sc] Repair: archive purge failed:', e);
          }

          // Re-run branch repair (handles summarizedUpTo pointer itself going missing)
          if (await repairIfBranched(msgs)) repaired++;

          // [REPAIR] Re-sync lastMessageCount to the live chat so the poll loop
          // is not confused by a stale count after messages were deleted.
          try {
            var freshCount = await tavo.message.count();
            patchState({ lastMessageCount: freshCount });
          } catch (e) {
            console.warn('[sc] Repair: could not re-sync message count:', e);
          }

          // Recover snippets lost to a manual delete: re-summarize any hidden
          // message span no longer covered by a Layer 0 snippet.
          var settings = await getEffectiveSettings();
          var freshMsgs = await getAllMessages();
          var recoveredCount = await recoverLostSnippets(freshMsgs, settings);
          repaired += recoveredCount;

          // [REPAIR] Fill sparse tags: any Layer 0 snippet with fewer than 3 tags
          // gets a tag-generation pass using the actual message passage as input
          // so the LLM has real conversational context, not just the summary text.
          // Tags already on the snippet are kept; only new non-duplicate tags are added.
          try {
            var tagState = getState();
            if (tagState.layers && tagState.layers[0]) {
              var sparseSnippets = [];
              for (var tsi = 0; tsi < tagState.layers[0].length; tsi++) {
                var tsn = tagState.layers[0][tsi];
                if (!Array.isArray(tsn.tags) || tsn.tags.length < 3) sparseSnippets.push(tsi);
              }
              if (sparseSnippets.length > 0) {
                tavo.utils.toast('Filling tags for ' + sparseSnippets.length + ' snippet(s)...');
                var tagMsgs = freshMsgs; // already fetched above
                var tagSettings = settings;
                var tagFilled = 0;
                for (var tpi = 0; tpi < sparseSnippets.length; tpi++) {
                  if (_abortRequested) break;
                  // Re-read state each iteration in case a prior loop pass saved
                  tagState = getState();
                  var layer0 = tagState.layers && tagState.layers[0];
                  if (!layer0) break;
                  var idx = sparseSnippets[tpi];
                  var sn = layer0[idx];
                  if (!sn) continue;

                  // Build the passage: prefer turnRange over stored text so the
                  // LLM sees full dialogue context rather than the already-compressed summary.
                  var passage;
                  if (sn.turnRange) {
                    passage = buildPassageFromRange(tagMsgs, sn.turnRange[0], sn.turnRange[1]);
                  }
                  if (!passage || !passage.trim()) {
                    // Fallback: use the stored summary text itself
                    passage = sn.text || '';
                  }
                  if (!passage.trim()) continue;

                  // Context = all other snippets across all layers (same as regen)
                  var tagCtxParts = [];
                  for (var lci = tagState.layers.length - 1; lci >= 0; lci--) {
                    var ll = tagState.layers[lci];
                    if (!ll) continue;
                    for (var lcj = 0; lcj < ll.length; lcj++) {
                      if (lci === 0 && lcj === idx) continue;
                      tagCtxParts.push(ll[lcj].text);
                    }
                  }
                  var tagCtx = tagCtxParts.length > 0 ? tagCtxParts.join(' ') : '(none yet)';

                  var tagResult = await callSummarizer(passage, tagCtx, tagSettings, true);
                  if (!tagResult || !tagResult.tags || tagResult.tags.length === 0) continue;

                  // Merge: keep existing, add new non-duplicate tags up to 8 total
                  var existingTags = Array.isArray(sn.tags) ? sn.tags : [];
                  var seen = {};
                  for (var ei = 0; ei < existingTags.length; ei++) seen[existingTags[ei].toLowerCase()] = true;
                  var merged = existingTags.slice();
                  for (var ni = 0; ni < tagResult.tags.length; ni++) {
                    var nt = tagResult.tags[ni].toLowerCase();
                    if (!seen[nt] && merged.length < 8) { seen[nt] = true; merged.push(nt); }
                  }

                  // Write back only if we actually added tags
                  if (merged.length > existingTags.length) {
                    tagState = getState();
                    if (tagState.layers && tagState.layers[0] && tagState.layers[0][idx]) {
                      tagState.layers[0][idx].tags = merged;
                      // Keep archive in sync if this snippet has a turnRange
                      if (sn.turnRange) {
                        updateArchiveEntryByTurnRange(sn.turnRange, { tags: merged });
                      }
                      saveState(tagState);
                      tagFilled++;
                    }
                  }
                }
                if (tagFilled > 0) repaired += tagFilled;
              }
            }
          } catch (e) {
            console.warn('[sc] Repair: tag fill failed:', e);
          }

          // Manual repair counts as a repair cycle — reset the auto-repair counter
          // so the next auto-repair fires after a fresh interval, not immediately.
          saveAutoRepairCount(0);

          // Reset fingerprint so updateInjection() writes through and the LTM
          // reconciliation block cannot re-import just-pruned orphan snippets
          // from stale tavo.memory content.
          _lastInjectedKey = null;
          await updateInjection();
          tavo.utils.toast(repaired > 0 ? t('toast.repaired', {count: repaired}): t('toast.noIssuesFound'));
        } finally {
          repairBtn.disabled = false;
          repairBtn.textContent = t('btn.repair');
          renderAll();
        }
      });

      async function applyImportedData(text) {
        var data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          tavo.utils.toast(t('toast.invalidJson'));
          return;
        }
        if (!data.layers || !Array.isArray(data.layers)) {

        try {
          var state = getState();
          var msgs = await getAllMessages();
          await unghostAllMessages(msgs);
          state.layers = data.layers;
          state.summarizedUpTo = data.summarizedUpTo != null ? data.summarizedUpTo: -1;
          state.ghostedIds = Array.isArray(data.ghostedIds) ? data.ghostedIds: [];
          saveState(state);
          if (Array.isArray(data.archive)) {
            setArchiveFromFlat(data.archive);

          if (state.summarizedUpTo >= 0) {
            await ghostMessagesUpTo(state.summarizedUpTo, msgs);
          }
          await updateInjection();
          tavo.utils.toast(t('toast.memoryImported'));
          closeIoModal();
          renderAll();
        } catch (err) {
          console.error('[sc] import failed:', err);
          tavo.utils.toast(t('toast.importFailed', {err: (err && err.message ? err.message: err)}));
        }
      }

      if (clearBtn) clearBtn.addEventListener('click', async function () {
        var actionsRow = clearBtn.closest('.sc-actions');
        var confirmed = await showInlineConfirm(actionsRow, {
          title: t('confirm.clearMemory.title'),
          message: t('confirm.clearMemory.message'),
          confirmLabel: t('btn.clearMemory'),
          icon: 'delete_forever'
        });
        if (!confirmed) return;

        clearBtn.disabled = true;
        clearBtn.textContent = t('btn.clearing');
        try {
          var msgs = await getAllMessages();
          await unghostAllMessages(msgs);

          // Only pinned snippets survive a clear — everything else is wiped.
          // custom=true alone is not enough; the snippet must also be pinned.
          var preState = getState();
          var savedCustomSnippets = [];
          if (preState.layers && preState.layers[0]) {
            for (var ci = 0; ci < preState.layers[0].length; ci++) {
              var _csn = preState.layers[0][ci];
              if (_csn.pinned) {
                savedCustomSnippets.push(_csn);
              }
            }
          }

          // Delete all chat-scoped vars (sc_state, sc_summary, sc_triggered,
          // sc_archive_meta, sc_archive_1..N). Config and custom prompt are
          // global-scoped and intentionally preserved.
          var deletions = [
            tavo.unset('sc_state', 'chat'),
            tavo.unset(SUMMARY_VAR_KEY, 'chat'),
            tavo.unset(TRIGGERED_VAR_KEY, 'chat'),
            tavo.unset(ARCHIVE_META_KEY, 'chat'),
          ];
          // Delete every archive shard that exists
          var meta = getArchiveMeta();
          for (var n = 1; n <= meta.shardCount; n++) {
            deletions.push(tavo.unset(ARCHIVE_VAR_PREFIX + n, 'chat'));
          }
          try {
            await Promise.all(deletions);
          } catch (e) {
            console.error('[sc] failed to delete some vars during clear:', e);
          }

          // Reset in-memory state
          _lastTriggered = [];
          _lastInjectedKey = null;
          _deletedSnippetTexts = {}; // clear tombstones — fresh slate

          // Restore custom snippets into a fresh state
          if (savedCustomSnippets.length > 0) {
            var freshState = getState(); // returns blank default now
            ensureLayer(freshState, 0);
            for (var ri = 0; ri < savedCustomSnippets.length; ri++) {
              freshState.layers[0].push(savedCustomSnippets[ri]);
            }
            saveState(freshState);
            console.log('[sc] Preserved ' + savedCustomSnippets.length + ' custom snippet(s) after clear');
          }

          // Sync native long-term memory: only keep custom snippet texts, remove all SC output.
          // Preserve the existing enabled state — don't force-disable just because snippets
          // were cleared; the user may still want LTM on.
          try {
            var mem = await tavo.memory.current();
            var clearChatCfg = isPerChatSettingsEnabled() ? getChatConfig() : null;
            if (clearChatCfg && clearChatCfg.ltmEnabled != null) {
              // Per-chat explicit preference — honour it.
              mem.enabled = !!clearChatCfg.ltmEnabled;
            } else if ((_configCache || getConfig()).nativeMemoryManual) {
              // Global explicit preference — mirror tavo.memory as-is.
              // (mem.enabled already reflects Tavo's live state, leave it.)
            } else {
              // Nothing explicit yet — auto-disable only when no snippets remain.
              mem.enabled = savedCustomSnippets.length > 0;
            }
            mem.memories = savedCustomSnippets.map(function (sn) { return sn.text; });
            await tavo.memory.update(mem);
            _ltmMemoryCache = mem;
            // Mark the final state as the explicit preference so future polls mirror it.
            if (isPerChatSettingsEnabled()) {
              setChatConfig({ ltmEnabled: mem.enabled });
            } else {
              setConfig({ nativeMemoryManual: true });
            }
          } catch (e) {
            console.error('[sc] failed to sync native memory after clear:', e);
          }

          await updateInjection();
          updateFabBadge(getState());
          tavo.utils.toast(savedCustomSnippets.length > 0
            ? t('toast.memoryCleared') + ' (' + savedCustomSnippets.length + ' custom snippet(s) kept)'
            : t('toast.memoryCleared'));
        } finally {
          clearBtn.disabled = false;
          clearBtn.textContent = t('btn.clearMemory');
          renderAll();
        }
      });

      // Snippet text click → edit
      var snippetTexts = body.querySelectorAll('.sc-snippet-text');
      for (var i = 0; i < snippetTexts.length; i++) {
        snippetTexts[i].addEventListener('click', function (e) {
          var target = e.target.closest('.sc-snippet-text') || e.currentTarget;
          var layerIdx = parseInt(target.getAttribute('data-layer'), 10);
          var snippetIdx = parseInt(target.getAttribute('data-idx'), 10);
          var state = getState();
          var layer = state.layers[layerIdx];
          if (!layer || !layer[snippetIdx]) return;
          var sn = layer[snippetIdx];

          var wrap = document.createElement('div');
          wrap.className = 'sc-textarea-wrap';
          var textarea = document.createElement('textarea');
          textarea.className = 'sc-snippet-edit';
          textarea.value = sn.text;
          var handle = document.createElement('div');
          handle.className = 'sc-resize-handle';
          handle.title = 'Drag to resize';
          wrap.appendChild(textarea);
          wrap.appendChild(handle);
          // Switch parent snippet row to column so textarea spans full width
          var snippetRow = target.closest('.sc-snippet');
          if (snippetRow) snippetRow.classList.add('is-editing');
          target.replaceWith(wrap);
          textarea.style.height = 'auto';
          textarea.style.height = textarea.scrollHeight + 'px';
          attachResizeHandle(handle, textarea);
          textarea.focus();
          textarea.select();

          var saved = false;
          async function saveEdit() {
            if (saved) return;
            saved = true;
            var newText = textarea.value.trim();
            if (newText && newText !== sn.text) {
              sn.text = newText;
              // sid and turnRange (message/promotion IDs) are intentionally
              // preserved — only the display text changes.
              // custom=true is only set for user-created snippets (no turnRange).
              // SC-generated snippets keep their SC identity even after a text edit.
              sn.timestamp = Date.now();
              if (!sn.turnRange) sn.custom = true;
              saveState(state);
              // Reset the fingerprint BEFORE updateInjection() so the
              // reconciliation block (which guards on _lastInjectedKey !== null)
              // is skipped and cannot revert the edit from stale LTM content.
              _lastInjectedKey = null;
              await updateInjection();
              tavo.utils.toast(t('toast.snippetUpdated'));
            }
            renderAll();
          }
          textarea.addEventListener('blur', saveEdit);
          textarea.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
              e.preventDefault(); saveEdit();
            } else if (e.key === 'Escape') {
              saved = true; renderAll();

      // Snippet delete
      var delBtns = body.querySelectorAll('.sc-snippet-btn.del');
      for (var i = 0; i < delBtns.length; i++) {
        delBtns[i].addEventListener('click', async function (e) {
          e.stopPropagation();
          var target = e.currentTarget;
          var layerIdx = parseInt(target.getAttribute('data-layer'), 10);
          var snippetIdx = parseInt(target.getAttribute('data-idx'), 10);
          var state = getState();
          var layer = state.layers[layerIdx];
          if (!layer || !layer[snippetIdx]) return;
          var preview = layer[snippetIdx].text.slice(0, 60) + (layer[snippetIdx].text.length > 60 ? '...': '');
          var snippetRow = target.closest('.sc-snippet');

          // Confirm inline, directly under the snippet row (no native popup).
          var precheck = await showInlineConfirm(snippetRow, {
            title: t('confirm.deleteSnippet.title'),
            message: t('confirm.deleteSnippet.message'),
            preview: preview,
            confirmLabel: t('btn.delete'),
            icon: 'delete_forever'
          });
          if (!precheck) return;
          // Tombstone the text so updateInjection()'s reconciliation never
          // re-imports it from tavo.memory (which still holds the old value
          // until SC writes the next injection cycle).
          _deletedSnippetTexts[layer[snippetIdx].text] = true;
          _lastInjectedKey = null; // force write-through on next updateInjection
          layer.splice(snippetIdx, 1);
          // Recalculate summarizedUpTo if layer 0 changed
          if (layerIdx === 0 && state.layers[0] && state.layers[0].length > 0) {
            var maxEnd = -1;
            for (var j = 0; j < state.layers[0].length; j++) {
              if (state.layers[0][j].turnRange && state.layers[0][j].turnRange[1] > maxEnd) {
                maxEnd = state.layers[0][j].turnRange[1];
              }
            }
            state.summarizedUpTo = maxEnd;
          } else if (layerIdx === 0) {
            state.summarizedUpTo = -1;

          saveState(state);
          await updateInjection();
          tavo.utils.toast(t('toast.snippetDeleted'));
          renderAll();

      // Snippet pin/unpin

      for (var i = 0; i < pinBtns.length; i++) {

          var target = e.currentTarget;
          var layerIdx = parseInt(target.getAttribute('data-layer'), 10);
          var snippetIdx = parseInt(target.getAttribute('data-idx'), 10);

      // Snippet move up / move down

      for (var i = 0; i < moveUpBtns.length; i++) {
        moveUpBtns[i].addEventListener('click', function (e) {
          e.stopPropagation();

          var layerIdx = parseInt(target.getAttribute('data-layer'), 10);
          var snippetIdx = parseInt(target.getAttribute('data-idx'), 10);
          if (snippetIdx === 0) return;

          saveState(state);

      var moveDownBtns = body.querySelectorAll('.sc-snippet-btn.move-down');
      for (var i = 0; i < moveDownBtns.length; i++) {
        moveDownBtns[i].addEventListener('click', function (e) {
          e.stopPropagation();
          var target = e.currentTarget;
          var layerIdx = parseInt(target.getAttribute('data-layer'), 10);
          var snippetIdx = parseInt(target.getAttribute('data-idx'), 10);
          var state = getState();
          var layer = state.layers[layerIdx];
          if (!layer || snippetIdx >= layer.length - 1) return;
          var tmp = layer[snippetIdx + 1];
          layer[snippetIdx + 1] = layer[snippetIdx];
          layer[snippetIdx] = tmp;
          saveState(state);
          renderAll();
        });
      }

      // Snippet regenerate (Layer 0: from source turns; Layer 1+: from stored source snippet texts)
      var redoBtns = body.querySelectorAll('.sc-snippet-btn.redo');
      for (var i = 0; i < redoBtns.length; i++) {
        redoBtns[i].addEventListener('click', async function (e) {
          e.stopPropagation();
          var target = e.currentTarget;
          var layerIdx = parseInt(target.getAttribute('data-layer'), 10);
          var snippetIdx = parseInt(target.getAttribute('data-idx'), 10);
          var state = getState();
          var layer = state.layers[layerIdx];
          if (!layer || !layer[snippetIdx]) return;
          var sn = layer[snippetIdx];
          var hasSourceTexts = sn.sourceTexts && sn.sourceTexts.length > 0;
          if (!sn.turnRange && !hasSourceTexts) return;
          if (_isSummarizing) {
            tavo.utils.toast(t('toast.alreadySummarizing')); return;
          }

          var regenPreview = sn.text.slice(0, 60) + (sn.text.length > 60 ? '...': '');
          var snippetRow = target.closest('.sc-snippet');

          // Confirm inline, directly under the snippet row (no native popup).
          var regenPrecheck = await showInlineConfirm(snippetRow, {
            title: t('confirm.regenSnippet.title'),
            message: t('confirm.regenSnippet.message'),
            preview: regenPreview,
            confirmLabel: t('btn.regenerate'),
            icon: 'autorenew'
          });
          if (!regenPrecheck) return;

          target.textContent = '...';
          target.disabled = true;
          _isSummarizing = true;

          try {
            var settings = await getEffectiveSettings();
            var isL0 = !!sn.turnRange;
            var regenResult;

            if (isL0) {
              // ── Layer 0: re-summarize the original raw turns ──────────────
              var msgs = await getAllMessages();
              var storyTxt = buildPassageFromRange(msgs, sn.turnRange[0], sn.turnRange[1]);
              if (!storyTxt.trim()) {
                tavo.utils.toast(t('toast.sourceTurnsEmpty')); throw new Error('abort');
              }
              // Build context excluding this snippet
              var contextParts = [];
              for (var ci = state.layers.length - 1; ci >= 0; ci--) {
                var l = state.layers[ci];
                if (!l) continue;
                for (var cj = 0; cj < l.length; cj++) {
                  if (ci === layerIdx && cj === snippetIdx) continue;
                  contextParts.push(l[cj].text);
                }
              }
              var contextStr = contextParts.length > 0 ? contextParts.join(' ') : '(none yet)';
              tavo.utils.toast(t('toast.regeneratingSnippet'));
              regenResult = await callSummarizer(storyTxt, contextStr, settings, true);
              if (!regenResult || !regenResult.text) {
                tavo.utils.toast(t('toast.regenFailed')); throw new Error('abort');
              }
            } else {
              // ── Layer 1+: trace back through the archive to raw turns ─────
              // Find the L0 archive entries that were merged into this snippet
              // using their sids, then re-summarize each from raw turns, and
              // finally merge those fresh results — mirroring maybePromoteLayer.
              var mergedSids = sn.mergedSids || [];
              var archive = getArchive();

              // Build a sid→archiveEntry map for fast lookup
              var archiveBySid = {};
              for (var ai = 0; ai < archive.length; ai++) {
                if (archive[ai].sid) archiveBySid[archive[ai].sid] = archive[ai];
              }

              // Resolve each sid to its archive entry; fall back to sourceTexts
              // order if a sid is missing (pre-sid legacy snippets).
              var sourceEntries = [];
              var allSidsResolved = mergedSids.length > 0;
              for (var si = 0; si < mergedSids.length; si++) {
                var entry = archiveBySid[mergedSids[si]];
                if (entry) {
                  sourceEntries.push(entry);
                } else {
                  allSidsResolved = false;
                }
              }

              if (allSidsResolved && sourceEntries.length > 0) {
                // Re-summarize each source L0 entry from its raw turns,
                // then merge the fresh results — full two-pass reroll.
                var msgs2 = await getAllMessages();
                var freshL0Texts = [];
                tavo.utils.toast(t('toast.regeneratingSnippet'));
                for (var ei = 0; ei < sourceEntries.length; ei++) {
                  var srcEntry = sourceEntries[ei];
                  var srcTxt;
                  if (srcEntry.turnRange) {
                    srcTxt = buildPassageFromRange(msgs2, srcEntry.turnRange[0], srcEntry.turnRange[1]);
                  } else {
                    // No turnRange on this archive entry — use its stored text
                    srcTxt = srcEntry.text || '';
                  }
                  if (!srcTxt.trim()) continue;
                  // Context = everything except the snippet being regenerated
                  var l0CtxParts = [];
                  for (var lci = state.layers.length - 1; lci >= 0; lci--) {
                    var ll = state.layers[lci];
                    if (!ll) continue;
                    for (var lcj = 0; lcj < ll.length; lcj++) {
                      if (lci === layerIdx && lcj === snippetIdx) continue;
                      l0CtxParts.push(ll[lcj].text);
                    }
                  }
                  var l0Ctx = l0CtxParts.length > 0 ? l0CtxParts.join(' ') : '(none yet)';
                  var l0Result = await callSummarizer(srcTxt, l0Ctx, settings, true);
                  if (l0Result && l0Result.text) freshL0Texts.push(l0Result.text);
                }

                if (freshL0Texts.length === 0) {
                  tavo.utils.toast(t('toast.regenFailed')); throw new Error('abort');
                }

                // Merge pass (same as maybePromoteLayer's merge call)
                var mergeStory = freshL0Texts.join(' ');
                var mergeCtx = buildFullContext(state, layerIdx + 1);
                regenResult = await callSummarizer(mergeStory, mergeCtx, settings, false);
                if (!regenResult || !regenResult.text) {
                  tavo.utils.toast(t('toast.regenFailed')); throw new Error('abort');
                }
              } else {
                // Fallback: sids unavailable (legacy snippet) — re-merge from
                // stored sourceTexts, which is at least a fresh LLM pass over them.
                var fallbackTxt = (sn.sourceTexts || []).join(' ');
                if (!fallbackTxt.trim()) {
                  tavo.utils.toast(t('toast.sourceSnippetsEmpty')); throw new Error('abort');
                }
                tavo.utils.toast(t('toast.regeneratingSnippet'));
                var fbCtx = buildFullContext(state, layerIdx + 1);
                regenResult = await callSummarizer(fallbackTxt, fbCtx, settings, false);
                if (!regenResult || !regenResult.text) {
                  tavo.utils.toast(t('toast.regenFailed')); throw new Error('abort');
                }
              }
            }

            // Re-read fresh state after all the async summarizer calls, in case
            // polling or another operation saved state while we were awaiting.
            state = getState();
            var freshLayer = state.layers[layerIdx];
            if (!freshLayer || !freshLayer[snippetIdx]) throw new Error('abort');
            sn = freshLayer[snippetIdx];

            sn.text = regenResult.text;
            if (isL0) sn.tags = (regenResult.tags && regenResult.tags.length > 0) ? regenResult.tags : (sn.tags || []);
            sn.timestamp = Date.now();
            sn.regenerated = true;
            // Keep the permanent archive in sync so future "Triggered Memories"
            // retrieval reflects the corrected text/tags, not the stale original.
            if (isL0 && sn.turnRange) {
              updateArchiveEntryByTurnRange(sn.turnRange, {
                text: sn.text, tags: sn.tags, timestamp: sn.timestamp
              });
            }
            saveState(state);
            _lastInjectedKey = null; // force updateInjection to write fresh, skip stale-LTM reconciliation
            await updateInjection();
            tavo.utils.toast(t('toast.snippetRegenerated'));
          } catch (e) {
            if (!e || e.message !== 'abort') console.error('[sc] redo failed:', e);
          } finally {
            _isSummarizing = false;
            renderAll();
          }
        });
      }
    }
    
    // ––––– Textarea resize handle
    function attachResizeHandle(handle, ta, inverted) {
      if (!handle || handle.__scAttached) return;
      handle.__scAttached = true;
      var minH = parseFloat(getComputedStyle(ta).minHeight) || 40;
      var startY = 0,
      startH = 0,
      maxALLOWED = 9999,
      dragging = false;

      function onMove(e) {
        if (!dragging) return;
        var y = e.touches ? e.touches[0].clientY: e.clientY;
        // inverted (top handle): drag up = grow, drag down = shrink
        var delta = inverted ? (startY - y): (y - startY);
        ta.style.height = Math.min(maxALLOWED, Math.max(minH, startH + delta)) + 'px';
        if (e.cancelable) e.preventDefault();
      }
      function onEnd() {
        if (!dragging) return;
        dragging = false;
        handle.classList.remove('dragging');
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onEnd);
        window.removeEventListener('touchmove', onMove);
        window.removeEventListener('touchend', onEnd);
      }
      function onStart(e) {
        dragging = true;
        handle.classList.add('dragging');
        startY = e.touches ? e.touches[0].clientY: e.clientY;
        startH = ta.offsetHeight;
        if (inverted) {
          var stickyFooter = document.getElementById('sc-sticky-footer');
          var scBody = document.getElementById('sc-body');
          var bodyRoom = scBody ? Math.max(0, scBody.offsetHeight - 60): 0;
          maxALLOWED = startH + bodyRoom;
          // Pin footer to its current size + available body room so it cannot push the panel taller
          if (stickyFooter) {
            stickyFooter.style.flex = '0 0 auto';
            stickyFooter.style.maxHeight = (stickyFooter.offsetHeight + bodyRoom) + 'px';
          }
        } else {
          maxALLOWED = parseFloat(getComputedStyle(ta).maxHeight) || 600;
        }
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
        window.addEventListener('touchmove', onMove, {
          passive: false
        });
        window.addEventListener('touchend', onEnd);
        if (e.cancelable) e.preventDefault();
      }
      handle.addEventListener('mousedown', onStart);
      handle.addEventListener('touchstart', onStart, {
        passive: false
      });
      handle.addEventListener('dblclick', function () {
        ta.style.height = '';
        if (inverted) {
          var sf = document.getElementById('sc-sticky-footer');
          if (sf) {
            sf.style.maxHeight = ''; sf.style.flex = '';
          }
        }
      });
    }
    function bindResizeHandles() {
      // Search both the scrollable body and the sticky footer
      var containers = [
        document.getElementById('sc-body'),
        document.getElementById('sc-sticky-footer-scroll')
      ];
      containers.forEach(function (panel) {
        if (!panel) return;
        panel.querySelectorAll('.sc-textarea-wrap').forEach(function (wrap) {
          var ta = wrap.querySelector('textarea');
          var handle = wrap.querySelector('.sc-resize-handle');
          if (ta && handle) {
            // Top-anchored handles (preview) expand upward — invert the drag direction
            var inverted = handle.classList.contains('sc-resize-handle-top');
            attachResizeHandle(handle, ta, inverted);
          }
        });
      });
    }

    // ––––– Textarea focus: compact mode
    (function () {
      var overlay = document.getElementById('sc-overlay');
      if (!overlay) return;
      var _focusedTA = null;
      function onTAFocus(e) {
        if (e.target.tagName === 'TEXTAREA') {
          _focusedTA = e.target;
          overlay.classList.add('sc-textarea-focused');
        }
      }
      function onTABlur(e) {
        if (e.target.tagName === 'TEXTAREA') {
          // Use a short delay so clicks inside the panel don't flicker
          setTimeout(function () {
            if (!overlay.querySelector('textarea:focus')) {
              _focusedTA = null;
              overlay.classList.remove('sc-textarea-focused');
            }
          }, 150);
        }
      }
      overlay.addEventListener('focusin', onTAFocus);
      overlay.addEventListener('focusout', onTABlur);
    })();

    // ––––– Event listeners from actions.js
    window.addEventListener('summaryception:open', function () {
      openPanel();
    });
    window.addEventListener('summaryception:force', function () {
      if (!_panelOpen) openPanel();
      var forceBtn = document.getElementById('sc-btn-force');
      if (forceBtn) forceBtn.click();
    });
    window.addEventListener('summaryception:stop',
      function () {
        _abortRequested = true;
        if (_panelOpen) renderAll();
      });
    window.addEventListener('summaryception:clear',
      function () {
        if (!_panelOpen) openPanel();
        var clearBtn = document.getElementById('sc-btn-clear');
        if (clearBtn) clearBtn.click();
      });
    window.addEventListener('summaryception:config-changed',
      function () {
        _configCache = getConfig();
        applyFabVisibility();
        if (_panelOpen) renderAll();
      });

    // ––––– Init
    (async function init() {
      try {
        // Install console hooks immediately since capture is on by default
        _debugInstallHooks();
        translateStaticDOM(overlay);
        if (typeof tavo !== 'undefined') {
          _configCache = getConfig();
          applyFabVisibility();
          var state = getState();
          // [Populate sc_summary immediately on chat open — don't wait for the
          // startPolling()/updateInjection() chain (message.count, branch repair,
          // etc.), which is async and can fail silently. This runs first, direct
          // from whatever's already in sc_state, so old snippets from before this
          // patch was installed are picked up right away, not just on the next
          // poll tick.]
          writeSummaryVar(state);
          updateFabBadge(state);
          // [autoEnableLtm manifest setting: if the user has enabled "Auto-enable Long-Term Memory"
          // in plugin settings, turn Tavo native LTM on automatically when the plugin loads,
          // and mark nativeMemoryManual so updateInjection() respects it going forward.]
          try {
            var autoLtm = tavo.plugin.config.get('autoEnableLtm');
            if (autoLtm) {
              var initMem = await tavo.memory.current();
              if (!initMem.enabled) {
                initMem.enabled = true;
                await tavo.memory.update(initMem);
                _ltmMemoryCache = initMem;
              }
              // Mark the auto-enable as an explicit preference so updateInjection()
              // mirrors Tavo's live state going forward. In per-chat mode, save to
              // sc_chat_config so each chat tracks its own LTM state independently.
              if (isPerChatSettingsEnabled()) {
                setChatConfig({ ltmEnabled: true });
              } else {
                var initCfg = _configCache || getConfig();
                if (!initCfg.nativeMemoryManual) {
                  setConfig({ nativeMemoryManual: true });
                  _configCache = getConfig();
                }
              }
            }
          } catch (e) {
            console.warn('[sc] autoEnableLtm init failed:', e);
          }
        }
      } catch (e) {
        console.error('[sc] init failed:', e);
      }
      startPolling();
    })();
  })();
</script>
