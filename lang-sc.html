<!--
  Summaryception — UI language catalog.

  How this works:
  - This file defines window.SC_LANG, a plain object: { "<LangName>": { "<key>": "<string>" }, ... }
  - Language names match the manifest.json "uiLanguage" select options exactly
    (e.g. "Spanish", "Chinese", "Japanese"), so no separate mapping table is needed.
  - panel-sc.html loads this object and looks up strings with t(key, vars), reading the
    active language from tavo.plugin.config.get('uiLanguage'). This is a separate setting
    from "outputLanguage" (which only controls the language of generated summaries).
  - "auto" and any language without an entry below (or any missing key within an entry)
    transparently falls back to the "English" block, so the UI never shows a blank string.
  - Placeholders use {name} syntax, e.g. "Deleted {count} item(s)".

  Currently translated: Spanish, Portuguese (BR), German, Chinese, Japanese.
  These are exactly the "uiLanguage" options in manifest.json (aside from "auto" and
  "English"); to add another UI language, add its option to "uiLanguage" in manifest.json,
  then copy the "English" block below, translate the values, and rename the key to match.
-->
